<script>
// библиотека обязательна. если основной источник недоступен —
// перебираем запасные и только потом сдаёмся
window.__libReady = (function(){
  var MIRRORS = [
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://cdn.skypack.dev/@supabase/supabase-js@2',
    'https://esm.sh/@supabase/supabase-js@2?bundle'
  ];
  function has(){ return !!(window.supabase && window.supabase.createClient); }
  function load(url){
    return new Promise(function(res){
      var s = document.createElement('script');
      s.src = url; s.crossOrigin = 'anonymous';
      s.onload = function(){ res(has()); };
      s.onerror = function(){ res(false); };
      document.head.appendChild(s);
      setTimeout(function(){ res(has()); }, 6000);
    });
  }
  return (async function(){
    if (has()) return true;
    // основной скрипт мог ещё грузиться — подождём немного
    for (var i = 0; i < 12; i++){
      if (has()) return true;
      await new Promise(function(r){ setTimeout(r, 250); });
    }
    for (var j = 0; j < MIRRORS.length; j++){
      if (await load(MIRRORS[j])) return true;
    }
    return has();
  })();
})();
</script>
<style>
:root{--bg:#080c0a;--elev:#080c0a;--surf:#121714;--card2:#171e19;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.11);--ink:#ffffff;--dim:#8b948f;--dim2:#5e6763;--g:#2bbd66;--g2:#22a256;--gs:rgba(47,208,111,.12);--am:#eda13a;--gold:#e8b84b;--blue:#5aa9f0;--red:#e2585a;--sh:none;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#070a09;font-family:Golos Text,sans-serif;color:var(--ink);display:flex;justify-content:center;}
.device{width:100%;max-width:430px;height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;}
.checker{height:5px;flex-shrink:0;background-image:linear-gradient(45deg,var(--ink) 25%,transparent 25%),linear-gradient(-45deg,var(--ink) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--ink) 75%),linear-gradient(-45deg,transparent 75%,var(--ink) 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0;opacity:.08;}
.rsw{display:flex;gap:5px;padding:8px 14px;background:var(--elev);border-bottom:1px solid var(--line);flex-shrink:0;}
.rb{flex:1;text-align:center;padding:8px;border-radius:9px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;border:1px solid transparent;}
.rb.on{background:var(--surf);border-color:var(--line2);color:var(--g);}
.top{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--elev);border-bottom:1px solid var(--line);flex-shrink:0;}
.brand{font-family:Golos Text,sans-serif;font-weight:700;font-size:20px;letter-spacing:1.5px;text-transform:uppercase;}
.brand em{font-style:normal;color:var(--g);}
.pill{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--line);padding:6px 12px;border-radius:100px;font-size:12px;color:var(--dim);}
.pill b{font-family:'Roboto Mono',monospace;color:var(--ink);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--g);animation:s 1.8s infinite;}
@keyframes s{0%,100%{opacity:1}50%{opacity:.4}}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.head{padding:16px 18px 4px;display:flex;align-items:baseline;justify-content:space-between;}
.head h2{font-family:Golos Text,sans-serif;font-weight:600;font-size:16px;letter-spacing:.6px;text-transform:uppercase;}
.head .m{font-size:11.5px;color:var(--dim);font-family:'Roboto Mono',monospace;}
.hero{padding:14px 14px 4px;}
.hgrid{display:flex;gap:10px;}
.hs{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--sh);}
.hs .n{font-family:'Roboto Mono',monospace;font-weight:700;font-size:24px;line-height:1;}
.hs .n.g{color:var(--g);}.hs .n.a{color:var(--am);}
.hs .l{font-size:11.5px;color:var(--dim);margin-top:6px;}
.cta{width:100%;margin-top:11px;background:var(--g);color:#06120b;border:none;border-radius:15px;padding:16px;font-family:Golos Text,sans-serif;font-weight:600;font-size:15px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;}
.cta:active{transform:scale(.98);}
.list{padding:8px 14px 24px;}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;animation:in .3s;}
.card.tap{cursor:pointer;}.card.tap:active{transform:scale(.98);}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.ava{width:46px;height:46px;border-radius:14px;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;font-family:Golos Text,sans-serif;font-weight:700;font-size:18px;color:#06120b;}
.nm{font-size:15px;font-weight:600;}
.sub{font-size:12.5px;color:var(--dim);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

.go{margin-left:auto;font-size:12px;font-weight:700;color:var(--g);white-space:nowrap;}
.form{padding:14px 18px;}
.addr{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:2px 14px;box-shadow:var(--sh);}
.ar{display:flex;align-items:center;gap:12px;padding:15px 0;}
.ar+.ar{border-top:1px solid var(--line);}
.pin{width:11px;height:11px;flex-shrink:0;border-radius:50%;background:var(--g);box-shadow:0 0 0 4px var(--gs);}
.pin.to{border-radius:3px;background:var(--am);box-shadow:0 0 0 4px rgba(242,167,59,.18);}
.ar input{border:none;background:transparent;outline:none;color:var(--ink);font-size:15px;width:100%;font-weight:500;font-family:Golos Text,sans-serif;}

.chips{display:flex;gap:8px;margin:12px 0 16px;flex-wrap:wrap;align-items:center;}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:100px;padding:9px 13px;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;line-height:1.2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;}
.chip.add{border-style:dashed;color:var(--g);border-color:rgba(51,209,126,.4);flex-shrink:0;background:transparent;font-size:12px;padding:8px 12px;}

.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line2);font-family:Golos Text,sans-serif;font-size:14px;text-transform:none;letter-spacing:0;padding:14px;margin-top:10px;}
.btn.dang{background:transparent;color:var(--red);border:1px solid rgba(226,88,90,.4);font-family:Golos Text,sans-serif;font-size:14px;text-transform:none;letter-spacing:0;padding:14px;margin-top:10px;}
.note{text-align:center;font-size:12px;color:var(--dim);margin-top:14px;line-height:1.6;}
.wait{padding:24px 18px 6px;text-align:center;}

.bea i:nth-child(2){animation-delay:.66s}.bea i:nth-child(3){animation-delay:1.33s}
.bea b{position:absolute;inset:20px;border-radius:50%;background:var(--g);}
@keyframes p{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}

.wait p{font-size:12.5px;color:var(--dim);margin-top:5px;}
.price{font-family:'Roboto Mono',monospace;font-weight:700;font-size:17px;}
.pick{background:var(--g);color:#06120b;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;}
.empty{text-align:center;padding:44px 26px;color:var(--dim);font-size:13px;line-height:1.6;}
.empty b{display:block;font-family:Golos Text,sans-serif;font-size:16px;color:var(--ink);margin-bottom:6px;}
.ok{width:60px;height:60px;border-radius:20px;background:var(--g);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.conf{padding:24px 20px;text-align:center;}
.conf h3{font-family:Golos Text,sans-serif;font-weight:600;font-size:19px;}
.conf p{font-size:12.5px;color:var(--dim);margin-top:6px;}
.dbox{margin-top:18px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;}
.fl{padding:10px 18px;}
.fr{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:12px;}
.fr label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px;}
.fr input{width:100%;background:transparent;border:none;outline:none;color:var(--ink);font-size:15px;font-weight:500;font-family:Golos Text,sans-serif;}
.fr input::placeholder{color:var(--dim);font-weight:400;}
.sv{padding:6px 18px 24px;}
.obar{display:flex;align-items:center;justify-content:space-between;margin:14px;padding:14px;background:var(--surf);border:1px solid var(--line);border-radius:15px;}
.obar.off{border-color:rgba(226,88,90,.45);}
.obar .l{font-size:14px;font-weight:600;}
.obar.off .l{color:var(--red);}
.tg{width:46px;height:27px;border-radius:100px;background:var(--line2);position:relative;cursor:pointer;transition:.2s;flex-shrink:0;}
.tg.on{background:var(--g);}
.tg b{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;}
.tg.on b{left:22px;}
.req{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:15px;margin:0 14px 11px;box-shadow:var(--sh);animation:in .3s;}
.req.direct{border-color:var(--am);}
.req .rt{font-size:15.5px;font-weight:600;}
.req .rm{font-size:12.5px;color:var(--dim);margin-top:4px;}
.req .rp{display:flex;align-items:center;gap:8px;margin-top:12px;}
.req .rp input{width:100px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px;color:var(--ink);font-family:'Roboto Mono',monospace;font-weight:700;font-size:15px;text-align:center;outline:none;}
.ra{display:flex;gap:8px;margin-top:10px;}
.ra .acc{flex:1;background:var(--g);color:#06120b;border:none;border-radius:11px;padding:12px;font-weight:700;font-size:13.5px;cursor:pointer;}
.ra .skip{background:transparent;color:var(--dim);border:1px solid var(--line2);border-radius:11px;padding:12px 16px;font-weight:600;font-size:13.5px;cursor:pointer;}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.3px;}
.badge.am{background:rgba(242,167,59,.2);color:var(--am);}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;}
.ast{background:var(--surf);border:1px solid var(--line);border-radius:15px;padding:15px;}
.ast .n{font-family:'Roboto Mono',monospace;font-weight:700;font-size:23px;}
.ast .n.g{color:var(--g)}.ast .n.a{color:var(--am)}
.ast .l{font-size:11.5px;color:var(--dim);margin-top:5px;}
.ai{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);}
.ai .ava{width:38px;height:38px;font-size:14px;border-radius:11px;}
.rolebtn{background:transparent;color:var(--dim);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
nav{display:flex;background:var(--elev);border-top:1px solid var(--line);padding:9px 8px calc(14px + env(safe-area-inset-bottom));flex-shrink:0;}
.nb{flex:1;min-width:0;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--dim);cursor:pointer;padding:4px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.pawrap{position:relative;width:70px;margin:0 auto 12px;}
.pa{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;font-family:Golos Text,sans-serif;font-weight:700;font-size:27px;color:#06120b;overflow:hidden;position:relative;flex-shrink:0;}

.avcam{position:absolute;right:0;bottom:0;width:24px;height:24px;border-radius:50%;background:var(--surf);border:2px solid var(--elev);display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;}
.avdel{display:inline-block;margin:-6px 0 10px;font-size:11.5px;color:var(--dim);cursor:pointer;}
.pn{font-family:Golos Text,sans-serif;font-weight:600;font-size:19px;}
.pr{font-size:12.5px;color:var(--dim);margin-top:3px;}
.ml{padding:6px 18px 24px;}
.mi{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:500;cursor:pointer;}
.mi .c{color:var(--dim);}
.mask{position:fixed;inset:0;background:rgba(4,6,5,.7);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:430px;background:var(--surf);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));}
.sheet h3{font-family:Golos Text,sans-serif;font-weight:600;font-size:17px;margin-bottom:4px;}
.sheet .s{font-size:12px;color:var(--dim);margin-bottom:14px;line-height:1.5;}
.sa{display:flex;gap:8px;margin-top:14px;}
.sa button{flex:1;border-radius:12px;padding:13px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;}

.abar{display:flex;align-items:center;gap:12px;background:var(--surf);border-top:1px solid var(--g);padding:11px 16px;cursor:pointer;flex-shrink:0;}
.abar .ava{width:36px;height:36px;font-size:14px;border-radius:11px;}
.abar .t{flex:1;min-width:0;}
.abar .t b{font-size:13px;display:block;}
.abar .t span{font-size:11.5px;color:var(--dim);}

.fav{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--line2);padding:4px 6px;}
.dright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.planwhen{background:rgba(240,180,60,.1);border:1px solid rgba(240,180,60,.28);border-radius:11px;
 padding:11px 14px;font-size:14.5px;font-weight:600;color:var(--am);margin-bottom:12px;}
.abar.plan{border-left:3px solid var(--am);}
.plbadge{background:var(--red);color:#fff;border-radius:20px;font-size:10px;font-weight:700;padding:1px 7px;}
.plancard{display:block!important;background:var(--surf);border:1px solid var(--line2);
 border-left:3px solid var(--am);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.plancard.ok{border-left-color:var(--g);}
.plrow{display:flex;align-items:center;gap:12px;}
.plclock{font-size:19px;line-height:1;flex-shrink:0;}
.plmain{flex:1;min-width:0;}
.plwhen{font-size:14px;font-weight:600;margin-bottom:3px;}
.plroute{font-size:12.5px;color:var(--ink);line-height:1.4;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.plsub{font-size:11.5px;color:var(--dim);margin-top:3px;}
.plgo{color:var(--dim);font-size:19px;flex-shrink:0;}
.plbadge{background:var(--red);color:#fff;border-radius:20px;font-size:11px;font-weight:700;
 padding:2px 8px;flex-shrink:0;}
.schedhead{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--am);margin:4px 0 10px;display:flex;gap:8px;align-items:center;}

.req.sched{border-left:3px solid var(--am);}
.schedwhen{font-size:12.5px;font-weight:600;color:var(--am);margin-bottom:7px;}
.schedwhen.soon{color:var(--red);}
.homecard{margin:0 14px 16px;background:linear-gradient(140deg,rgba(51,209,126,.09),rgba(51,209,126,.02));
 border:1px solid rgba(51,209,126,.22);border-radius:16px;padding:15px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;}
.hcico{font-size:26px;line-height:1;flex-shrink:0;}
.hctx{flex:1;min-width:150px;}
.hctx b{display:block;font-size:14.5px;margin-bottom:4px;}
.hctx span{display:block;font-size:12px;color:var(--dim);line-height:1.5;}
.hcact{display:flex;gap:8px;width:100%;}
.hcadd{flex:1;background:var(--g);color:#06120b;border:none;border-radius:11px;padding:11px;
 font-size:13.5px;font-weight:700;font-family:Golos Text,sans-serif;cursor:pointer;}
.hcno{background:none;border:none;color:var(--dim);font-size:12.5px;padding:11px 14px;
 font-family:Golos Text,sans-serif;cursor:pointer;}
.rmini{font-family:'Roboto Mono',monospace;font-size:12.5px;font-weight:700;color:#F7C948;white-space:nowrap;letter-spacing:.3px;}
.fav.on{color:var(--red);}

.refcode{flex:1;font-family:'Roboto Mono',monospace;font-size:22px;font-weight:700;letter-spacing:3px;color:var(--g);text-align:center;}
.reflink{flex:1;font-family:'Roboto Mono',monospace;font-size:12px;color:var(--g);word-break:break-all;line-height:1.5;}
.subcard{display:flex;align-items:center;gap:12px;margin:0 18px 14px;padding:14px;background:linear-gradient(135deg,rgba(51,209,126,.12),rgba(51,209,126,.03));border:1px solid var(--g);border-radius:14px;}
.subcard .sct{font-size:15px;}.subcard .scs{font-size:11.5px;color:var(--dim);margin-top:3px;}
.subbtn{background:var(--g);color:#06120b;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;}
.plan{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line2);border-radius:13px;margin-bottom:9px;cursor:pointer;transition:.15s;}
.plan.on{border-color:var(--g);background:rgba(51,209,126,.08);}
.plan .pd{flex:1;}.plan .pdt{font-size:15px;font-weight:600;}.plan .pds{font-size:11.5px;color:var(--dim);margin-top:2px;}
.plan .pp{font-size:17px;font-weight:700;font-family:'Roboto Mono',monospace;}
.plan .best{font-size:9px;background:var(--g);color:#06120b;padding:2px 6px;border-radius:5px;font-weight:700;margin-left:6px;vertical-align:middle;}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(16px);background:var(--g);color:#06120b;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.28s;z-index:90;pointer-events:none;max-width:88%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#boot{
 position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
 z-index:200;color:var(--dim);font-size:14px;padding:20px;text-align:center;
 transition:opacity .35s ease;
}
#boot.gone{opacity:0;pointer-events:none;}

.bsplash{display:flex;flex-direction:column;align-items:center;gap:0;}

/* шашечки — как на борту такси */
.bchk{
 width:132px;height:9px;margin-bottom:26px;border-radius:2px;
 background:
  repeating-linear-gradient(90deg,#f2f5f3 0 11px,transparent 11px 22px) 0 0/22px 4.5px repeat-x,
  repeating-linear-gradient(90deg,transparent 0 11px,#f2f5f3 11px 22px) 0 4.5px/22px 4.5px repeat-x;
 opacity:.9;
 animation:bchkin .5s ease both;
}
@keyframes bchkin{from{opacity:0;transform:translateY(-6px)}to{opacity:.9;transform:none}}

/* вывеска: по ней проходит свет фар */
.bmark{
 position:relative;font-family:Golos Text,sans-serif;font-weight:700;
 font-size:44px;line-height:1;letter-spacing:2.5px;color:#f2f5f3;
 animation:bmarkin .55s .1s ease both;
}
.bmark em{font-style:normal;color:var(--g);}
.bmark::after{
 content:"";position:absolute;inset:-6px -22px;pointer-events:none;
 background:linear-gradient(102deg,transparent 38%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.15) 56%,transparent 64%);
 transform:translateX(-115%);
 animation:bsweep 2.6s 1s ease-in-out infinite;
 mix-blend-mode:screen;
}
@keyframes bmarkin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bsweep{0%{transform:translateX(-115%)}55%,100%{transform:translateX(115%)}}

.btag{
 margin-top:12px;font-family:Golos Text,sans-serif;font-size:12.5px;letter-spacing:.4px;
 color:var(--dim);animation:bmarkin .55s .25s ease both;
}

/* дорожная разметка вместо крутилки */
.broad{
 position:relative;width:148px;height:2px;margin-top:34px;border-radius:2px;
 background:rgba(255,255,255,.07);overflow:hidden;
 animation:bmarkin .55s .4s ease both;
}
.broad i{
 position:absolute;inset:0;
 background:repeating-linear-gradient(90deg,var(--g) 0 16px,transparent 16px 34px);
 animation:broadrun 1.1s linear infinite;
}
@keyframes broadrun{from{transform:translateX(-34px)}to{transform:translateX(0)}}

@media (prefers-reduced-motion:reduce){
 .bmark::after{animation:none;opacity:0;}
 .broad i{animation:none;}
 .bchk,.bmark,.btag,.broad{animation-duration:.01ms;}
}

/* ================= НОВЫЙ ВИД ================= */
body{background:var(--bg);font-family:Golos Text,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.device{background:var(--bg);}
::selection{background:var(--g);color:#04140a;}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px;}
.body::-webkit-scrollbar{width:0;}
.checker{display:none;}

/* шапка */
.top{background:transparent;border:none;padding:16px 18px 4px;}
.brand{font-family:Golos Text,sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;}
.brand em{color:var(--g);font-style:normal;}
.citychip{background:transparent;border:none;color:var(--dim);font-size:13px;padding:0;}
.pill{background:transparent;border:none;padding:0;gap:7px;font-size:15px;font-weight:600;}
.dot{width:7px;height:7px;position:relative;}
.dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--g);opacity:.4;animation:bpl 3s ease-out infinite;}
@keyframes bpl{0%{transform:scale(.5);opacity:.6}70%,100%{transform:scale(1.4);opacity:0}}

/* переключатель ролей */
.rsw{background:var(--surf);border:none;border-radius:14px;padding:4px;gap:4px;margin:12px 18px 0;}
.rb{flex:1;border-radius:11px;border:none;background:transparent;padding:10px 0;
 font-family:Golos Text,sans-serif;font-size:14px;font-weight:500;color:var(--dim);}
.rb.on{background:var(--card2);color:var(--ink);}

/* город */
.cityhead{display:flex;align-items:flex-start;gap:11px;padding:14px 18px 0;}
.cityhead .cp{width:22px;height:22px;margin-top:7px;flex-shrink:0;}
.cityhead .cp svg{width:100%;height:100%;stroke:var(--ink);fill:none;stroke-width:1.8;}
.cityhead h1{font-family:Golos Text,sans-serif;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.05;}
.cityhead .cs{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13.5px;margin-top:6px;}
.cityhead .cchip{margin-left:auto;text-align:right;padding-top:5px;flex-shrink:0;}
.cityhead .cchip .n{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:16px;font-weight:600;}
.cityhead .cchip .l{font-size:11px;color:var(--dim2);margin-top:2px;}
.bpx{width:7px;height:7px;border-radius:50%;background:var(--g);flex-shrink:0;}

/* сводка строкой */
.sumline{display:flex;align-items:center;gap:9px;margin:20px 18px 0;color:var(--dim);font-size:13.5px;flex-wrap:wrap;}
.sumline b{color:var(--ink);font-weight:600;font-size:14.5px;}
.sumline s{width:3px;height:3px;border-radius:50%;background:var(--dim2);text-decoration:none;}

/* кнопки */
.hero{padding:0 18px;}
.cta{width:100%;margin-top:14px;height:62px;border:none;border-radius:17px;box-shadow:none;
 background:var(--g);color:#04140a;
 font-family:Golos Text,sans-serif;font-size:15.5px;font-weight:700;letter-spacing:0;text-transform:none;
 display:flex;align-items:center;justify-content:space-between;padding:0 22px;
 transition:transform .15s cubic-bezier(.2,.8,.2,1);}
.cta svg{width:19px;height:19px;stroke:#04140a;fill:none;stroke-width:2.2;flex-shrink:0;}
.cta:active{transform:scale(.985);}
.cta2{width:100%;margin-top:10px;background:var(--surf);border:none;border-radius:15px;padding:15px 17px;
 display:flex;align-items:center;gap:13px;font-family:Golos Text,sans-serif;font-size:14.5px;
 font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;cursor:pointer;}
.cta2 .dic{width:21px;height:21px;flex-shrink:0;}
.cta2 .dic svg{width:100%;height:100%;stroke:var(--ink);fill:none;stroke-width:1.7;}
.cta2 .dt2{flex:1;text-align:left;}
.btn{border-radius:16px;height:56px;background:linear-gradient(180deg,var(--g),var(--g2));color:#04140a;
 font-family:Golos Text,sans-serif;font-weight:700;font-size:15.5px;text-transform:none;letter-spacing:0;box-shadow:none;}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--ink);font-weight:500;}
.btn.dang{background:none;border:1px solid rgba(226,88,90,.3);color:var(--red);font-weight:500;}
.pick{background:var(--g);color:#04140a;border-radius:13px;font-weight:700;}

/* заголовок раздела */
.head{padding:26px 18px 10px;}
.head h2{font-family:Golos Text,sans-serif;font-weight:600;font-size:14.5px;letter-spacing:0;text-transform:none;color:var(--ink);}
.head .m{font-family:Golos Text,sans-serif;font-size:12px;color:var(--dim2);}

/* карточка водителя */
.list{padding:0 18px 24px;}
.dcard{background:var(--surf);border:none;border-radius:17px;padding:15px;display:flex;align-items:center;gap:13px;margin-bottom:9px;box-shadow:none;}
.dcard .ava{width:52px;height:52px;border-radius:50%;background:#1e2a24;color:var(--g);
 font-family:Golos Text,sans-serif;font-weight:600;font-size:20px;flex-shrink:0;position:relative;overflow:visible;}
.dcard .ava img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.dcard .ava .onx{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px var(--surf);}
.dcard .nmx{font-family:Golos Text,sans-serif;font-size:16.5px;font-weight:600;letter-spacing:-.01em;}
.dcard .row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);margin-top:3px;}
.dcard .row svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0;}
.dcard .row.dl{color:var(--blue);}
.dcard .row em{color:var(--g);font-style:normal;}
.dcard .row .car,.dcard .row .loc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dcard .dright{flex-direction:column;align-items:flex-end;gap:11px;flex-shrink:0;}
.rmini{display:flex;align-items:center;gap:5px;font-family:Golos Text,sans-serif;font-size:15.5px;font-weight:600;color:var(--ink);}
.rmini svg{width:14px;height:14px;fill:var(--gold);}
.fav{font-size:19px;color:var(--line2);background:none;border:none;padding:0;}
.fav.on{color:var(--g);}
.plate{border-radius:8px;font-size:10.5px;padding:2px 7px;}

/* факты */
.facts{display:flex;background:var(--surf);border-radius:17px;margin:18px 18px 0;}
.facts .f{flex:1;padding:15px 8px;text-align:center;}
.facts .f+.f{border-left:1px solid var(--line);}
.facts .v{font-family:Golos Text,sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em;}
.facts .v small{font-size:11.5px;font-weight:500;color:var(--dim);margin-left:2px;}
.facts .l{font-size:11px;color:var(--dim2);margin-top:3px;}

/* остальные карточки */
.card{background:var(--surf);border:none;border-radius:17px;box-shadow:none;padding:15px;margin-bottom:9px;}
.req{background:var(--surf);border:none;border-radius:17px;box-shadow:none;margin:0 18px 10px;padding:16px;}
.req.direct{box-shadow:0 0 0 1px var(--gs);}
.ra .acc{background:var(--g);color:#04140a;border-radius:14px;font-weight:700;font-size:14.5px;padding:14px;}
.ra .skip{border:1px solid var(--line2);border-radius:14px;font-weight:500;padding:14px 18px;}

/* поля */
.form{padding:0 18px;}
.addr{background:var(--surf);border:none;border-radius:17px;box-shadow:none;padding:4px 16px;}
.ar{padding:16px 0;}
.ar+.ar{border-top:1px solid var(--line);}
.pin{width:9px;height:9px;box-shadow:none;}
.pin.to{background:var(--am);border-radius:2px;box-shadow:none;}
.fr{background:var(--surf);border:none;border-radius:15px;padding:14px 16px;box-shadow:none;}
.fr label{font-size:12.5px;color:var(--dim2);text-transform:none;letter-spacing:0;}
.chip{background:var(--surf);border:none;border-radius:12px;font-weight:500;}
.chip.on{background:var(--g);color:#04140a;}

/* меню профиля */
.ph{background:transparent;border:none;padding:20px 18px 18px;}
.pa{border-radius:50%;background:#1e2a24;color:var(--g);font-family:Golos Text,sans-serif;font-weight:600;}
.pn{font-family:Golos Text,sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em;}
.pr{font-size:13.5px;color:var(--dim);}
.mi{background:var(--surf);border:none;border-radius:0;padding:16px;font-size:14.5px;font-weight:400;}
.mi:first-child{border-radius:17px 17px 0 0;}
.mi:last-child{border-radius:0 0 17px 17px;}
.mi+.mi{border-top:1px solid var(--line);}
.mi .c{color:var(--dim2);font-size:13px;}

/* статистика панели */
.ast{background:var(--surf);border:none;border-radius:16px;box-shadow:none;padding:15px;}
.ast .n{font-family:Golos Text,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.03em;}
.ast .l{font-size:12px;color:var(--dim2);margin-top:3px;}
.agrid{padding:16px 18px;gap:9px;}
.ai{background:var(--surf);border:none;border-radius:15px;padding:13px 15px;margin-bottom:8px;}
.hgrid{gap:9px;}
.hs{background:var(--surf);border:none;border-radius:16px;box-shadow:none;padding:15px;}
.hs .n{font-family:Golos Text,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.03em;}
.hs .l{font-size:12px;color:var(--dim2);margin-top:3px;}

/* тумблер смены */
.obar{background:var(--surf);border:none;border-radius:19px;margin:16px 18px 0;padding:19px;}
.tg{background:#2a312d;}
.tg.on{background:var(--g);}

/* навигация */
nav{background:transparent;border-top:1px solid var(--line);padding:9px 6px calc(11px + env(safe-area-inset-bottom));}
.nb{font-family:Golos Text,sans-serif;font-size:10.5px;font-weight:400;gap:5px;color:var(--dim2);position:relative;}
.nb svg{width:22px;height:22px;stroke-width:1.8;}
.nb.active{color:var(--g);}
.nb.active::after{content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
 width:24px;height:2.5px;border-radius:2px;background:var(--g);}

/* шторки и мелочи */
.mask{background:rgba(4,7,5,.75);backdrop-filter:blur(3px);}
.sheet{background:var(--card2);border-radius:22px 22px 0 0;}
.sheet h3{font-family:Golos Text,sans-serif;font-weight:700;letter-spacing:-.02em;}
.sa .o{background:var(--g);color:#04140a;border-radius:14px;font-weight:700;}
.sa .c{border:1px solid var(--line2);border-radius:14px;}
.empty b{font-family:Golos Text,sans-serif;font-weight:600;font-size:16px;}
.badge{font-weight:600;letter-spacing:0;text-transform:none;font-size:11px;border-radius:8px;}
.abar{background:var(--card2);border-top:1px solid var(--line);}
.stars span.on{color:var(--gold);}
.plancard{background:var(--surf);border:none;border-radius:17px;box-shadow:none;}


/* блок смены: строки не должны слипаться */
.shift{background:var(--surf);border:1px solid rgba(47,208,111,.25);border-radius:17px;margin:0 18px 10px;padding:16px;
 display:flex;align-items:center;gap:14px;}
.shift .t{flex:1;min-width:0;}
.shift .t b{display:block;font-family:Golos Text,sans-serif;font-size:16px;font-weight:600;}
.shift .t span{display:block;font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.5;}
.shift .t span#sleft{color:var(--am);margin-top:2px;}
.shift .clk{font-family:Golos Text,sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--g);flex-shrink:0;}
.btn.ghost{height:48px;border-radius:14px;}


/* поля ввода: текст должен быть хорошо виден */
input,textarea,select{
  color:var(--ink)!important;
  font-family:Golos Text,system-ui,sans-serif;
  font-size:16px;
  caret-color:var(--g);
  background:transparent;
}
input::placeholder,textarea::placeholder{color:var(--dim2);opacity:1;}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 60px var(--surf) inset;}
.gate input,.fr input,.fr textarea{
  color:var(--ink)!important;font-size:16px;font-weight:500;
}
.gate input{
  width:100%;background:var(--surf);border:1px solid rgba(47,208,111,.45);
  border-radius:15px;padding:16px;margin-top:6px;
}
.gate input:focus{border-color:var(--g);outline:none;}


/* иконки внутри текста */
.ii{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
 vertical-align:-2px;margin-right:6px;display:inline-block;}
.mi2 svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;display:block;}
.motonote{display:flex;align-items:center;gap:0;}

/* тумблеры режимов */
.modes{gap:9px;padding:0 18px;}
.mode{background:var(--surf);border:1px solid transparent;border-radius:15px;padding:14px 12px;
 font-family:Golos Text,sans-serif;font-size:14px;font-weight:500;color:var(--dim);
 display:flex;align-items:center;gap:9px;}
.mode.on{border-color:rgba(47,208,111,.4);color:var(--ink);background:var(--card2);}
.mode i{margin-left:auto;font-style:normal;font-size:12px;color:var(--dim2);}
.mode.on i{color:var(--g);}

/* компактная кнопка продления */
.extbtn{height:46px;margin-top:0;font-size:14px;font-weight:500;
 border-radius:14px;letter-spacing:0;text-transform:none;}

/* строка «где стою» */
.card .nm{display:flex;align-items:center;font-size:15.5px;font-weight:600;}
.card .sub{font-size:12.5px;color:var(--dim);margin-top:3px;}
.card .go{color:var(--g);font-size:13px;font-weight:500;}

/* полоса «вы на линии» */
.obar{display:flex;align-items:center;justify-content:space-between;}
.obar .l{font-family:Golos Text,sans-serif;font-size:17px;font-weight:600;}


/* ровные отступы блоков кабинета водителя */
.obar{margin:14px 18px 10px;}
.modes{margin-bottom:10px;}
.shift{margin:0 18px 10px;}
.motonote{margin:0 18px 10px;border-radius:15px;padding:14px 16px;}
.ii{flex-shrink:0;}
.avcam{display:flex;align-items:center;justify-content:center;}


/* значки в строках карточки — ровный размер и отступ */
.emj{font-size:13px;line-height:1;width:16px;display:inline-flex;justify-content:center;flex-shrink:0;
 filter:saturate(.85);}
.cityhead{padding-left:18px;}


/* ================= ПАЛИТРЫ ================= */
body[data-t="orange"]{
  --bg:#0c0a08;--elev:#0c0a08;--surf:#171310;--card2:#1d1814;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#fff;--dim:#978c81;--dim2:#6a6058;
  --g:#e07a2b;--g2:#c56520;--gs:rgba(224,122,43,.12);
  --am:#e0a94a;--gold:#e0a94a;--blue:#6a9fd8;--onac:#1a0d02;
}
body[data-t="light"]{
  --bg:#f1f3f0;--elev:#f1f3f0;--surf:#fbfcfa;--card2:#e9ece7;
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.15);
  --ink:#0e1411;--dim:#6b7570;--dim2:#98a09b;
  --g:#1a9b53;--g2:#158445;--gs:rgba(26,155,83,.11);
  --am:#c98510;--gold:#d9a017;--blue:#2f7fd4;--onac:#fff;
}
body[data-t="mono"]{
  --bg:#0a0a0b;--elev:#0a0a0b;--surf:#141416;--card2:#1a1a1d;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --ink:#fff;--dim:#8e8e93;--dim2:#5f5f65;
  --g:#dcdce0;--g2:#c4c4c9;--gs:rgba(255,255,255,.08);
  --am:#e8b84b;--gold:#e8b84b;--blue:#7aa7d8;--onac:#0a0a0b;
}
body[data-t="blue"]{
  --bg:#070b12;--elev:#070b12;--surf:#0f1521;--card2:#141c2b;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --ink:#fff;--dim:#8b96ab;--dim2:#5d6779;
  --g:#4a85d6;--g2:#3a6fb8;--gs:rgba(74,133,214,.12);
  --am:#d99a3f;--gold:#dfae4a;--blue:#4a85d6;--onac:#02101f;
}

function phoneNorm(v){
 let d=String(v==null?'':v).replace(/\D/g,'');
 if(!d)return '';
 if(d[0]==='8')d='7'+d.slice(1);
 else if(d[0]!=='7')d='7'+d;
 return d.slice(0,11);
}
function phoneValid(v){const d=phoneNorm(v);return d.length===11;}
function phoneFmt(v){
 const d=phoneNorm(v);
 if(!d)return '';
 const p=d.slice(1);
 let s='+7';
 if(p.length)s+=' ('+p.slice(0,3);
 if(p.length>3)s+=') '+p.slice(3,6);
 else if(p.length===3)s+=')';
 if(p.length>6)s+='-'+p.slice(6,8);
 if(p.length>8)s+='-'+p.slice(8,10);
 return s;
}

async function restore(){
 const{data:all}=await db.from('rides').select('*').eq('passenger_id',me.id).in('status',['created','confirmed','in_progress']).order('created_at',{ascending:false}).limit(10);

 const list=all||[];
 planned=list.filter(r=>r.scheduled_at&&new Date(r.scheduled_at).getTime()>soon);
 if(planned.length)setTimeout(watchPlanned,600);
 const data=list.filter(r=>!planned.find(p=>p.id===r.id)).slice(0,1);
 if(data&&data.length){active=data[0];if(active.status==='created')subOffers(active.id);if(active.status==='confirmed'||active.status==='in_progress'){subRide(active.id);watchCompletion();watchUnread(active.id);}}
 // недавно завершённая поездка, которую пассажир ещё не оценил
 const dayAgo=new Date(Date.now()-24*3600*1000).toISOString();
 const{data:fin}=await db.from('rides').select('*').eq('passenger_id',me.id).eq('status','completed').gte('created_at',dayAgo).order('created_at',{ascending:false}).limit(1);
 if(fin&&fin.length&&fin[0].driver_id){
   const{data:rev}=await db.from('reviews').select('id').eq('ride_id',fin[0].id).eq('from_id',me.id).limit(1);
   if(!rev||!rev.length){pendingDone=fin[0];}
 }

async function restoreD(){
 const{data:allD}=await db.from('rides').select('*').eq('driver_id',me.id).in('status',['confirmed','in_progress']).order('created_at',{ascending:false}).limit(10);
 const soonD=Date.now()+40*60*1000;
 const listD=allD||[];
 dPlanned=listD.filter(r=>r.scheduled_at&&new Date(r.scheduled_at).getTime()>soonD);
 const data=listD.filter(r=>!dPlanned.find(p=>p.id===r.id)).slice(0,1);
 if(data&&data.length)dActive=data[0];
 const{data:o}=await db.from('offers').select('*').eq('driver_id',me.id).eq('status','pending');
 myOffs=o||[];
 const{data:sh}=await db.from('shifts').select('*').eq('driver_id',me.id).is('ended_at',null).order('started_at',{ascending:false}).limit(1);
 curShift=(sh&&sh.length)?sh[0]:null;
 // смена закончилась по расписанию — закроем и покажем итог при заходе
 if(curShift&&curShift.planned_end&&new Date(curShift.planned_end)<new Date()){
  const end=new Date();const mins=Math.max(1,Math.round((end-new Date(curShift.started_at))/60000));
  await api('/api/action',{action:'shift-close',shift_id:curShift.id,minutes:mins,auto_closed:true});
  await api('/api/me/update',{status:'offline'});
  me.status='offline';const st0=curShift.started_at;curShift=null;
  pendingShift={mins,from:st0,to:end};
 }
 if(curShift&&!curShift.planned_end){
  const dur=Date.now()-new Date(curShift.started_at).getTime();
  if(dur>10*60*60*1000){
   const end=new Date();const mins=Math.round(dur/60000);
   await api('/api/action',{action:'shift-close',shift_id:curShift.id,minutes:mins});
   await api('/api/me/update',{status:'offline'});
   me.status='offline';const st=curShift.started_at;curShift=null;
   pendingShift={mins,from:st,to:end};
  }
 }
 // смена, закрытая бэкендом за неактивность, которую водитель ещё не видел
 if(!curShift&&!pendingShift){
  const{data:done}=await db.from('shifts').select('*').eq('driver_id',me.id).not('ended_at','is',null).order('ended_at',{ascending:false}).limit(1);
  if(done&&done.length){

   if(seen!==s.id&&(Date.now()-new Date(s.ended_at).getTime())<3*60*60*1000){
    pendingShift={mins:s.minutes||0,from:s.started_at,to:new Date(s.ended_at),sid:s.id};
   }
  }
 }
}

let PLOFF={},planPoll=null;
async function watchPlanned(){
 if(planPoll)clearInterval(planPoll);
 const tick=async()=>{
  if(!planned.length||role!=='passenger')return;
  const ids=planned.filter(r=>!r.driver_id).map(r=>r.id);
  if(!ids.length)return;
  try{
   const{data}=await db.from('offers').select('ride_id').in('ride_id',ids).eq('status','pending');
   const cnt={};(data||[]).forEach(o=>{cnt[o.ride_id]=(cnt[o.ride_id]||0)+1;});
   let grew=false;
   Object.keys(cnt).forEach(id=>{ if((cnt[id]||0)>(PLOFF[id]||0))grew=true; });
   PLOFF=cnt;
   if(grew){
    T('Водитель откликнулся на заказ ко времени');
    if(pTab==='home')drawP();
   }
  }catch(e){}
 };
 tick();planPoll=setInterval(tick,15000);
}

function pickAvatar(){
 const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=async()=>{
  const f=i.files[0];if(!f)return;
  T('Загружаем фото…');
  try{
   const small=await shrink(f,600);
   const path=`${me.id}.jpg`;
   const{error}=await db.storage.from('avatars').upload(path,small,{upsert:true,contentType:'image/jpeg'});
   if(error){T('Не загрузилось: '+error.message);return;}
   const url=db.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?t='+Date.now();
   const _rc=await api('/api/me/update',{avatar:url});const e2=_rc.error?{message:'ошибка'}:null;
   if(e2){T('Не сохранилось');return;}
   me.avatar=url;
   T('Фото обновлено');
   if(role==='driver')drawD();else drawP();
  }catch(e){T('Не получилось загрузить');}
 };
 i.click();
}

function shrink(file,max){
 return new Promise((res,rej)=>{
  const img=new Image();const rd=new FileReader();
  rd.onload=e=>{img.src=e.target.result;};
  rd.onerror=()=>rej(new Error('не удалось прочитать файл'));
  img.onload=()=>{
   let{width:w,height:h}=img;
   if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
   const c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(img,0,0,w,h);
   c.toBlob(b=>b?res(b):rej(new Error('не удалось сжать')),'image/jpeg',0.8);
  };
  img.onerror=()=>rej(new Error('это не изображение'));
  rd.readAsDataURL(file);
 });
}

 if(!need.length)return;
 need.forEach(id=>{pplAvatars[id]=null;});
 const r=await api('/api/admin',{action:'avatars',ids:need});
 const got={};
 if(!r.error&&r.map){
  Object.entries(r.map).forEach(([id,url])=>{
   if(!url)return;
   got[id]=1;pplAvatars[id]=url;
   const el=document.getElementById('av'+id);
   if(el)el.innerHTML=`<img src="${url}" alt="">`;
  });
 }
 // у кого нет сохранённого фото — попросим бота достать, по одному

 avatarQueue.push(...missing);
 pumpAvatars();

async function pumpAvatars(){

   const f=await api('/api/admin',{action:'avatar-fetch',target_id:id});

 else if(ePeriod==='week'){a=new Date(now-6*864e5);a.setHours(0,0,0,0);b=new Date();b.setHours(23,59,59,999);title='7 дней';}

 <div class="sec">Поездки</div>

async function saveD(){

  if(!phoneValid(_ph)){T('Номер должен содержать 11 цифр');return;}
  const r=await api('/api/set-phone',{phone:phoneFmt(_ph)});

function paintAdminBadges(){
 const c=window.ADMC||{};
 const map={apps:c.apps||0,cmp:c.complaints||0};
 Object.keys(map).forEach(k=>{
  const b=document.querySelector(`.nb[onclick*="aGo('${k}')"]`);

  let dot=b.querySelector('.nbadge');
  if(map[k]>0){
   if(!dot){dot=document.createElement('span');dot.className='nbadge';b.appendChild(dot);}
   dot.textContent=map[k]>99?'99+':map[k];
  }else if(dot)dot.remove();
 });
}

async function okDrv(id){

function initStatRange(){
 if(statFrom&&statTo)return;
 const now=new Date();
 statTo=dstr(now);
 statFrom=dstr(new Date(now.getTime()-29*864e5));
}
function setStatRange(days){
 const now=new Date();
 statTo=dstr(now);statFrom=dstr(new Date(now.getTime()-(days-1)*864e5));

}

async function drawFunnel(){

 if(!box)return;
 if(!ACTfun){await loadActivity();}
 const f=ACTfun;
 if(!f){box.innerHTML='';return;}
 const pct=(a,b)=>b?Math.round(a/b*100):0;
 const rows=[
  ['Зарегистрировались',f.total,100,'var(--dim)'],
  ['Создали заявку',f.ordered,pct(f.ordered,f.total),'var(--g)'],
  ['Доехали хоть раз',f.arrived,pct(f.arrived,f.total),'var(--g)'],
  ['Заказали повторно',f.repeat,pct(f.repeat,f.total),'var(--am)'],
  ['Стали постоянными',f.loyal,pct(f.loyal,f.total),'var(--am)']
 ];

 box.innerHTML=`<div class="sec">Путь пользователя</div>

  ${rows.map(r=>`<div class="fnl">
   <div class="fnt">${r[0]}</div>
   <div class="fnb"><i style="width:${Math.max(2,r[2])}%;background:${r[3]}"></i></div>
   <div class="fnv">${r[1]}<span>${r[2]}%</span></div>
  </div>`).join('')}
 </div>
 ${never>0?`<div class="note" style="margin:6px 14px 14px">${never} ${plural(never,['человек зашёл','человека зашли','человек зашли'])} и ни разу не заказали. Посмотрите их во вкладке «Люди» → «Ни разу» — возможно, они заходили, когда на линии никого не было.</div>`:''}`;
}

const RST={completed:['✅','доехал','var(--g)'],confirmed:['🚗','в пути','var(--g)'],
 in_progress:['🚗','в пути','var(--g)'],created:['⏳','без ответа','var(--am)']};
function rstatus(r){
 const st=String(r.status||'');
 if(RST[st]){
  if(st==='created')return r.offers?['🤷','не выбрал из '+r.offers,'var(--am)']:['🔇','никто не откликнулся','var(--red)'];
  return RST[st];
 }
 if(st.includes('driver'))return ['↩️','водитель отказался','var(--red)'];
 if(st.includes('cancelled'))return ['❌','пассажир отменил','var(--red)'];
 return ['•',st,'var(--dim)'];
}

function loadQRLib(){

  if(window.QRCode&&window.QRCode.toCanvas)return res(true);
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
  s.crossOrigin='anonymous';
  s.onload=()=>res(true);
  s.onerror=()=>res(false);
  document.head.appendChild(s);
  setTimeout(()=>res(!!(window.QRCode&&window.QRCode.toCanvas)),4000);
 });
}

   if(err)qrFallback(canvas,text);

 }else qrFallback(canvas,text);
}

  const p=canvas.parentElement;
  if(p)p.innerHTML='<div style="color:#666;font-size:12px;padding:20px">Не удалось нарисовать код. Проверьте интернет.</div>';

async function aPpl(m){
 // список грузим раз в минуту, поиск фильтрует на месте — иначе ответы обгоняют друг друга
 if(!PPL_CACHE||Date.now()-PPL_AT>60000){
  const{data:us}=await db.from('users').select('*').order('created_at',{ascending:false}).limit(2000);
  PPL_CACHE=us||[];PPL_AT=Date.now();
 }
 const all=PPL_CACHE;
 const isStaffR=u=>u.staff_role&&u.staff_role!=='none';

 // приводим к общему виду: регистр, ё, лишние и неразрывные пробелы
 const nrm=s=>String(s==null?'':s).toLowerCase().replace(/ё/g,'е')
   .replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();

 let pool=all;
 if(pplQuery){
  const q=nrm(pplQuery);
  const qd=pplQuery.replace(/\D/g,'');
  pool=pool.filter(u=>nrm(u.name).includes(q)
    ||nrm(u.full_name).includes(q)
    ||nrm(u.admin_note).includes(q)
    ||nrm(u.car).includes(q)
    ||nrm(u.plate).includes(q)
    ||(qd.length>=3&&String(u.telegram_id||'').includes(qd))
    ||(qd.length>=3&&pplPhones[u.id]&&pplPhones[u.id].replace(/\D/g,'').includes(qd)));
 }
 if(pplAct==='ordered')pool=pool.filter(u=>ACT[u.id]&&ACT[u.id].made>0);
 if(pplAct==='never')  pool=pool.filter(u=>!ACT[u.id]||!ACT[u.id].made);
 if(pplAct==='repeat') pool=pool.filter(u=>ACT[u.id]&&ACT[u.id].made>1);

 // и только потом делим по ролям
 const groups={
  admin:pool.filter(u=>['owner','admin'].includes(u.staff_role)),
  mod:pool.filter(u=>u.staff_role==='moderator'),
  driver:pool.filter(u=>['driver','both'].includes(u.role)&&!isStaffR(u)),
  pass:pool.filter(u=>!['driver','both'].includes(u.role)&&!isStaffR(u))
 };
 let list;
 if(pplFilter==='admin')list=groups.admin;
 else if(pplFilter==='mod')list=groups.mod;
 else if(pplFilter==='driver')list=groups.driver;
 else if(pplFilter==='pass')list=groups.pass;
 else list=pool;
 const seg=[['all','Все',pool.length],['admin','Админы',groups.admin.length],['mod','Модеры',groups.mod.length],['driver','Водители',groups.driver.length],['pass','Пассажиры',groups.pass.length]];
 m.innerHTML=`<div class="head"><h2>Пользователи</h2><span class="m">${pplQuery?'найдено '+list.length:list.length}</span></div>
 <div class="search" style="margin:0 14px 10px"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="pplq" placeholder="Поиск: имя, телефон или ID" value="${esc(pplQuery)}" oninput="pplSearch(this.value)" autocomplete="off">${pplQuery?`<span class="sclr" onclick="pplQuery='';aPpl(document.getElementById('main'))">✕</span>`:''}</div>
 <div class="minifilter">${[['','все'],['ordered','заказывали'],['never','ни разу'],['repeat','повторно']].map(f=>`<span class="${pplAct===f[0]?'on':''}" onclick="pplAct='${f[0]}';aPpl(document.getElementById('main'))">${f[1]}</span>`).join('')}</div>
 <div class="seg">${seg.map(s=>`<div class="${pplFilter===s[0]?'on':''}" onclick="pplFilter='${s[0]}';aPpl(document.getElementById('main'))">${s[1]}<span style="opacity:.55;font-weight:500"> ${s[2]}</span></div>`).join('')}</div>
 <div style="padding:6px 0 24px">${list.map(u=>{
   const mine=u.id===me.id;
   const bd=isStaffR(u)?`<span class="badge am">${u.staff_role==='owner'?'владелец':u.staff_role==='admin'?'админ':'модератор'}</span>`:'';
   const bn=u.is_banned?'<span class="badge red">бан</span>':'';
   const on=['driver','both'].includes(u.role)&&u.status==='online'?'<span class="badge" style="background:var(--gs);color:var(--g)">на линии</span>':'';

 if(r.error)return T(r.error==='forbidden'?'Только владелец может менять права':'Ошибка');
 closeSh();T(v==='none'?'Права сняты':'Назначен: '+(v==='admin'?'админ':'модератор'));
 if(v!=='none'){setTimeout(()=>permsSheet(id),350);return;}
 drawA();
}

// ===== какие разделы открыты человеку =====
async function permsSheet(id){
 const r=await api('/api/admin',{action:'perms-get',target_id:id});
 if(r.error)return T(r.error==='forbidden'?'Только владелец':'Не удалось загрузить');
 if(r.owner)return T('У владельца всегда все разделы');
 const old=document.getElementById('sh');if(old)old.remove();
 window._pset=new Set(r.perms||[]);
 const g=r.groups||{};
 const rows=Object.keys(g).map(k=>
  `<div class="opt ${window._pset.has(k)?'sel':''}" data-k="${k}" onclick="togPerm('${k}')">
    <div class="rd"></div><div class="tx">${esc(g[k])}</div></div>`).join('');
 const m=document.createElement('div');m.className='mask';m.id='sh';
 m.innerHTML=`<div class="sheet"><h3>Разделы · ${esc(r.name||'')}</h3>
  <div class="s">Отметьте, что человек может делать. Всё остальное он даже не увидит.</div>
  <div id="pl" style="max-height:46vh;overflow-y:auto">${rows}</div>
  <div class="sa"><button class="c" onclick="closeSh();drawA()">Отмена</button>
  <button class="o" onclick="savePerms('${id}')">Сохранить</button></div></div>`;
 document.getElementById('device').appendChild(m);
}
function togPerm(k){
 if(window._pset.has(k))window._pset.delete(k); else window._pset.add(k);
 const el=document.querySelector('#pl .opt[data-k="'+k+'"]');
 if(el)el.classList.toggle('sel',window._pset.has(k));
}
async function savePerms(id){
 const list=[...window._pset];
 const r=await api('/api/admin',{action:'perms-set',target_id:id,perms:list});
 if(r.error)return T(r.error==='forbidden'?'Только владелец':'Не удалось сохранить');
 closeSh();T(list.length?'Открыто разделов: '+list.length:'Все разделы закрыты');drawA();
}
document.addEventListener('visibilitychange',async()=>{
 if(document.visibilityState!=='visible'||!me||role!=='passenger')return;
 try{
  const dayAgo=new Date(Date.now()-24*3600*1000).toISOString();
  const{data:fin}=await db.from('rides').select('*').eq('passenger_id',me.id).eq('status','completed').gte('created_at',dayAgo).order('created_at',{ascending:false}).limit(1);
  if(fin&&fin.length&&fin[0].driver_id&&!document.getElementById('sh')){
   const{data:rev}=await db.from('reviews').select('id').eq('ride_id',fin[0].id).eq('from_id',me.id).limit(1);
   if(!rev||!rev.length){active=null;passengerDone(fin[0]);}
  }
 }catch(e){}
});
boot();
</script>
