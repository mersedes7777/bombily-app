}
function stepPrice(dir,add){
 const cur=priceVal();
 if(add){if(cur)setPrice(cur+add);return;}
 if(!cur){if(dir>0)setPrice(priceStart());return;}
 const st=cur>1000?50:10;
 const nv=Math.round((cur+dir*st)/st)*st;
 setPrice(nv>=st?nv:null);
}
// с какой суммы начинать, если цену ещё не вписали
function priceStart(){
 if(orderKind!=='delivery'&&!interCity&&_priceHint&&_priceHint.city===me.city&&_priceHint.med)return _priceHint.med;
 return interCity?500:150;

let _priceHint=null;
async function loadPriceHint(){
 try{
  const h=document.getElementById('phint');
  if(!h||orderKind==='delivery'||interCity)return;
  if(!_priceHint||_priceHint.city!==me.city){
   const city=me.city;
   _priceHint={city,med:0,lo:0,hi:0};
   const since=new Date(Date.now()-60*864e5).toISOString();
   const{data}=await db.from('rides').select('price').eq('city',city).eq('status','completed').is('to_city',null).or('kind.is.null,kind.eq.ride').gte('created_at',since).not('price','is',null).limit(300);
   const a=(data||[]).map(r=>Number(r.price)).filter(x=>x>=50&&x<=3000).sort((x,y)=>x-y);
   if(a.length>=10){
    const q=p=>a[Math.min(a.length-1,Math.floor(p*(a.length-1)))];
    const r10=x=>Math.round(x/10)*10;
    _priceHint={city,med:r10(q(.5)),lo:r10(q(.25)),hi:r10(q(.75))};
   }
  }
  const h2=document.getElementById('phint');
  if(h2&&_priceHint&&_priceHint.med&&orderKind!=='delivery'&&!interCity)
   h2.innerHTML='Обычно по городу <b>'+(_priceHint.lo===_priceHint.hi?_priceHint.med:_priceHint.lo+'–'+_priceHint.hi)+' ₽</b>';
 }catch(e){}
}

  e.textContent='заявка живёт ещё '+Math.floor(ms/60000)+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0');

  try{

   if(r.status==='completed'){
    const done=active;active=null;clearInterval(doneWatch);doneWatch=null;

    const{data:rev}=await db.from('reviews').select('id').eq('ride_id',done.id).eq('from_id',me.id).limit(1);

   }
  }catch(e){}
 },8000);
}

 };

function shrink(file,max){
 return new Promise((res,rej)=>{
  const img=new Image();const rd=new FileReader();
  rd.onload=e=>{img.src=e.target.result;};
  rd.onerror=()=>rej(new Error('не удалось прочитать файл'));
  img.onload=()=>{
   let{width:w,height:h}=img;
   if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
   const c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(img,0,0,w,h);
   c.toBlob(b=>b?res(b):rej(new Error('не удалось сжать')),'image/jpeg',0.8);
  };
  img.onerror=()=>rej(new Error('это не изображение'));
  rd.readAsDataURL(file);
 });
}

let chatCh=null,chatRide=null,chatBack=null;
async function openChat(rideId,back){

 if(role==='passenger'){pTab='chat';}else{dTab='chat';}
 document.getElementById('abar').innerHTML='';
 document.getElementById('nav').innerHTML=`<button class="nb active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.5 8.5 0 01-3.9-.9L3 21l2-4.9A8.4 8.4 0 0121 11.5z"/></svg>Чат</button><button class="nb" onclick="closeChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Назад</button>`;
 const m=document.getElementById('main');
 m.innerHTML=`<div class="chat"><div class="cm" id="cm"><div class="empty">Загрузка…</div></div><div class="ci"><input id="cf" placeholder="Написать сообщение…" onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">➤</button></div></div>`;
 const r=await api('/api/chat-list',{ride_id:rideId});
 const data=r.items||[];
 const box=document.getElementById('cm');box.innerHTML='';
 if(r.error){box.innerHTML='<div class="empty">Не удалось загрузить переписку</div>';}
 else{
  data.forEach(msg=>putMsg(msg));
  if(!data.length)box.innerHTML='<div class="empty">Сообщений пока нет. Напишите первым.</div>';
  lastMsgAt=data.length?data[data.length-1].created_at:null;
 }
 if(chatCh){db.removeChannel(chatCh);chatCh=null;}
 chatUnread=0;
 if(lastMsgAt)setSeen(rideId,lastMsgAt);
 startChatPoll(rideId);
}
let chatPoll=null,lastMsgAt=null;
let chatUnread=0,unreadPoll=null;
function seenKey(rid){return 'bmb_seen_'+rid;}
function getSeen(rid){try{return localStorage.getItem(seenKey(rid))||null;}catch(e){return null;}}
function setSeen(rid,ts){try{if(ts)localStorage.setItem(seenKey(rid),ts);}catch(e){}}
function watchUnread(rideId){
 if(unreadPoll)clearInterval(unreadPoll);
 chatUnread=0;
 const tick=async()=>{
  const inChat=(role==='passenger'&&pTab==='chat')||(role==='driver'&&dTab==='chat');
  const stillActive=(role==='passenger'&&active&&active.id===rideId)||(role==='driver'&&dActive&&dActive.id===rideId);
  if(!stillActive){clearInterval(unreadPoll);unreadPoll=null;chatUnread=0;return;}
  if(inChat)return;
  const r=await api('/api/chat-list',{ride_id:rideId,after:getSeen(rideId)});
  if(r.error||!r.items)return;
  const mine=r.items.filter(x=>x.sender_id!==me.id);
  if(mine.length){
   chatUnread=mine.length;
   if(role==='passenger'&&pTab!=='chat')drawBar();
   if(role==='driver'&&dTab==='ride')drawD();
  }
 };
 const safeTick=()=>{try{const p=tick();if(p&&p.catch)p.catch(()=>{});}catch(e){}};
 safeTick();unreadPoll=setInterval(safeTick,10000);
}
function startChatPoll(rideId){
 if(chatPoll)clearInterval(chatPoll);
 chatPoll=setInterval(async()=>{
  if(chatRide!==rideId||(pTab!=='chat'&&dTab!=='chat')){clearInterval(chatPoll);chatPoll=null;return;}
  const r=await api('/api/chat-list',{ride_id:rideId,after:lastMsgAt});
  if(r.error||!r.items||!r.items.length)return;
  const box=document.getElementById('cm');
  if(box&&box.querySelector('.empty'))box.innerHTML='';
  r.items.forEach(msg=>{if(msg.sender_id!==me.id)putMsg(msg);});
  lastMsgAt=r.items[r.items.length-1].created_at;setSeen(rideId,lastMsgAt);
 },4000);
}
function putMsg(msg){
 const box=document.getElementById('cm');if(!box)return;
 if(box.querySelector('.empty'))box.innerHTML='';
 const mine=msg.sender_id===me.id;
 box.insertAdjacentHTML('beforeend',`<div class="msg ${mine?'me':'them'}">${mine?'':'<span class="who">'+esc(msg.sender_name)+'</span>'}${esc(msg.text)}</div>`);
 box.scrollTop=box.scrollHeight;
}
async function sendMsg(){
 const i=document.getElementById('cf');const t=i.value.trim();if(!t)return;
 i.value='';
 putMsg({sender_id:me.id,sender_name:me.name,text:t});
 const r=await api('/api/chat-send',{ride_id:chatRide,text:t});
 if(r.error){T(r.error==='not_yours'?'Нет доступа к этой переписке':'Сообщение не отправлено');return;}
 if(r.msg&&r.msg.created_at)lastMsgAt=r.msg.created_at;
}
function closeChat(){
 if(chatPoll){clearInterval(chatPoll);chatPoll=null;}
 if(chatCh){db.removeChannel(chatCh);chatCh=null;}
 if(chatBack==='driver'){dGo('ride');}else{openRide();}
}

 let bars=[],unitTxt='';

  for(let i=0;i<R.len&&i<120;i++){const d=new Date(R.a.getTime()+i*864e5+12*3600e3);const k=ldstr(d);const v=byD[k]||{s:0,n:0};bars.push({k,lbl:R.len<=10?ST_WD[d.getDay()]+'<br>'+d.getDate():(i%5===0||i===R.len-1?String(d.getDate()):''),full:stDayTxt(k,true),s:v.s,n:v.n,we:d.getDay()===0||d.getDay()===6});}
  unitTxt='по дням';
 }
 eRows=bars;
 const best=bars.slice().sort((a,b)=>b.s-a.s)[0];
 const kp=`<div class="st-kpis">
  ${stKpi('Заработал',money,prev?sum(prev):null,' ₽')}
  ${stKpi('Поездок',sel.length,prev?prev.length:null,'')}
  ${stKpi('Средняя поездка',avg,null,' ₽',sel.length?'сколько в среднем за одну поездку':'')}
  ${R.len>1||ePeriod==='all'?`<div class="st-kpi"><div class="k">${ePeriod==='all'?'Лучший месяц':'Лучший день'}</div><div class="v">${best&&best.s?stFmt(best.s)+'<small> ₽</small>':'—'}</div>${best&&best.s?`<div class="x">${best.full}</div>`:''}</div>`
   :`<div class="st-kpi"><div class="k">Ваш рейтинг</div><div class="v">${Number(me.rating||5).toFixed(1).replace('.',',')}<small> ★</small></div><div class="x">оценка пассажиров</div></div>`}
 </div>
 ${prev?`<div class="st-cmpnote">Сравниваем с периодом «${cmpW}» — ${stPeriodText(ldstr(R.pa),ldstr(R.pb))}</div>`:''}`;
 const ch=bars.length?`<div class="st-card">

 // когда больше заказов в городе
 let demC='';
 if(dem&&dem.some(x=>x)){

  const win=[];for(let i=0;i<=21;i++)win.push([dem[i]+dem[i+1]+dem[i+2],i]);

    <div class="p">${r.price?stFmt(r.price)+' ₽':'—'}</div>

 m.innerHTML=top+kp+ch+demC+trips+'<div style="height:24px"></div>';

async function okDrv(id){

  const g=k=>{const e=document.getElementById(k+id);return e?e.value.trim():'';};
  const c=g('ac'), p=g('ap').toUpperCase(), n=g('an'), f=g('af'), ph=g('apn');
  if(!c||!p)return T('Впишите марку и номер');
  if(!n)return T('Впишите имя');
  if(ph&&!phoneValid(ph))return T('Проверьте телефон');
  const r=await api('/api/admin',{action:'driver-status',target_id:id,status:'approved',
   car:c,plate:p,name:n,full_name:f||null,phone:ph?phoneFmt(ph):null});
  if(r.error)return T('Ошибка: '+r.error);
  T('Водитель одобрен');drawA();
 });
}

 const uids=[...new Set((data||[]).flatMap(c=>[c.target_id,c.from_id]).filter(Boolean))];
 let umap={};
 if(uids.length){const{data:us}=await db.from('users').select('id,name,tg_username,has_phone').in('id',uids);(us||[]).forEach(u=>{umap[u.id]=u;});}
 m.innerHTML=`<div class="head"><h2>Жалобы</h2><span class="m">${(data||[]).length} открыто</span></div><div style="padding:8px 0 24px">${(data||[]).length?data.map(c=>{

 return `<div class="cp"><span class="badge ${isRev?'am':'red'}">${isRev?'спор по отзыву':'жалоба'}</span><div class="rs">${isRev?'Оспаривает: '+esc(c.from_name):'На: '+esc(c.target_name)}</div><div class="mt">${isRev?'':'от '+esc(c.from_name)+' · '}${new Date(c.created_at).toLocaleDateString('ru')}</div><div class="rs" style="font-weight:500;font-size:13.5px">${esc(c.reason)}</div>${c.comment?'<div class="mt">«'+esc(c.comment)+'»</div>':''}${(()=>{const who=umap[isRev?c.from_id:c.target_id];const wid=isRev?c.from_id:c.target_id;if(!who)return '';window.__cmpIds=(window.__cmpIds||[]).concat([wid]);return `<div class="appcontact"><a class="acbtn call" id="ccall${c.id}" style="display:none">📞 Позвонить</a>${who.tg_username?`<a class="acbtn tg" href="https://t.me/${esc(who.tg_username)}" target="_blank">✈️ Telegram</a>`:'<span class="acbtn dim">нет ника</span>'}<button class="acbtn wr" onclick="writeUser('${wid}','${esc(who.name)}')">💬 В бота</button></div>`;})()}
 <div class="ra">${isRev?`<button class="o" onclick="resolveCmp('${c.id}','dismiss')">Оставить отзыв</button><button class="b" onclick="killReview('${c.id}','${c.review_id}','${c.from_id}')">Удалить отзыв</button>`:`<button class="o" onclick="resolveCmp('${c.id}','dismiss')">Отклонить</button><button class="w" onclick="resolveCmp('${c.id}','warn','${c.target_id}')">Предупредить</button><button class="b" onclick="resolveCmp('${c.id}','ban','${c.target_id}')">Забанить</button>`}</div></div>`;
}).join(''):'<div class="empty"><b>Жалоб нет</b>Все обращения разобраны.</div>'}</div>`;
 loadAvatars([...new Set((window.__cmpIds||[]))]);window.__cmpIds=[];
 (data||[]).forEach(async c=>{

 });

let stPer='week',stChart='days',stSel=null,stData=null,stTok=0,stCityList=[];
// дата по времени телефона (а не по Гринвичу — ночью иначе «сегодня» уезжает на вчера)
function ldstr(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);}
function stFmt(n){return (Math.round(Number(n)||0)).toLocaleString('ru');}
function stDayTxt(k,full){const d=new Date(k+'T12:00:00');return d.getDate()+' '+ST_MON[d.getMonth()]+(full?', '+['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'][d.getDay()]:'');}
function stRange(){
 if(stPer!=='custom'){
  const now=new Date(),len=ST_LEN[stPer]||7;
  statTo=ldstr(now);statFrom=ldstr(new Date(now.getTime()-(len-1)*864e5));
 }
 const a=new Date(statFrom+'T12:00:00'),b=new Date(statTo+'T12:00:00');
 const len=Math.max(1,Math.round((b-a)/864e5)+1);
 return {len,pFrom:ldstr(new Date(a.getTime()-len*864e5)),pTo:ldstr(new Date(a.getTime()-864e5))};
}
function stPeriodText(f,t){
 f=f||statFrom;t=t||statTo;
 const a=new Date(f+'T12:00:00'),b=new Date(t+'T12:00:00');
 if(f===t)return a.getDate()+' '+ST_MON[a.getMonth()]+(t===ldstr(new Date())?', сегодня':'');
 if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear())return a.getDate()+'–'+b.getDate()+' '+ST_MON[b.getMonth()];
 return a.getDate()+' '+ST_MON[a.getMonth()]+' – '+b.getDate()+' '+ST_MON[b.getMonth()];
}
function stControls(back){
 const tabs=[['today','Сегодня'],['week','Неделя'],['month','Месяц'],['custom','Период']];
 const cities=stCityList.slice();
 if(statCity!=='all'&&!cities.includes(statCity))cities.push(statCity);
 return `${back?`<button class="st-back" onclick="statGo('total')"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>Вся статистика</button>`:''}
 <div class="st-per">${tabs.map(([k,l])=>`<div class="${stPer===k?'on':''}" onclick="stSetPer('${k}')">${l}</div>`).join('')}</div>
 ${cities.length>1||statCity!=='all'?`<div class="st-cities"><div class="${statCity==='all'?'on':''}" onclick="stSetCity('all')">Все города</div>${cities.map(c=>`<div class="${statCity===c?'on':''}" onclick="stSetCity('${esc(c)}')">${esc(c)}</div>`).join('')}</div>`:''}`;
}
function stSetPer(k){
 if(k==='custom'){stPeriodSheet();return;}
 stPer=k;stSel=null;if(k==='today')stChart='hours';else if(stChart==='hours'&&stPer!=='today')stChart='days';
 aStat(document.getElementById('main'));
}
function stSetCity(c){statCity=c;stSel=null;aStat(document.getElementById('main'));}
function stPeriodSheet(){
 const old=document.getElementById('sh');if(old)old.remove();
 const m=document.createElement('div');m.className='mask';m.id='sh';
 const mx=ldstr(new Date());
 m.innerHTML=`<div class="sheet"><h3>Свой период</h3><div class="s">Выберите первый и последний день</div>
 <div class="st-dates"><label><span>С</span><input type="date" id="sf" value="${statFrom}" max="${mx}"></label><label><span>По</span><input type="date" id="st" value="${statTo}" max="${mx}"></label></div>
 <div class="sa"><button class="c" onclick="closeSh()">Отмена</button><button class="o" onclick="stApplyCustom()">Показать</button></div></div>`;
 document.getElementById('device').appendChild(m);
}
function stApplyCustom(){
 const f=document.getElementById('sf')?.value,t=document.getElementById('st')?.value;
 if(!f||!t)return T('Выберите обе даты');
 if(f>t)return T('Первый день позже последнего');
 if((new Date(t)-new Date(f))/864e5>365)return T('Не больше года');
 statFrom=f;statTo=t;stPer='custom';stSel=null;if(stChart==='hours'&&f!==t)stChart='days';
 closeSh();aStat(document.getElementById('main'));
}
// сравнение с прошлым периодом: «▲ 12%  было 32»
function stDelta(now,was,unit){
 if(was===null||was===undefined)return '';
 if(!now&&!was)return `<span class="st-d fl">как и было</span>`;
 if(!was)return `<span class="st-d up">▲ было 0</span>`;
 const p=Math.round((now-was)/was*100);
 if(!p)return `<span class="st-d fl">столько же</span>`;
 return `<span class="st-d ${p>0?'up':'dn'}">${p>0?'▲':'▼'} ${Math.abs(p)}%</span><span class="st-was">было ${stFmt(was)}${unit||''}</span>`;
}
function stKpi(label,val,was,unit,note){
 return `<div class="st-kpi"><div class="k">${label}</div><div class="v">${stFmt(val)}${unit?`<small>${unit}</small>`:''}</div>${note?`<div class="x">${note}</div>`:''}<div class="dl">${stDelta(val,was,unit)}</div></div>`;
}
async function aStatMain(m){
 const tok=++stTok;
 const {len,pFrom,pTo}=stRange();
 const city=statCity;
 const head=()=>`<div class="head st-h"><div><h2>Статистика</h2><div class="st-sub">${stPeriodText()}${statCity!=='all'?' · '+esc(statCity):' · все города'}</div></div></div>`;
 m.innerHTML=head()+stControls()+`<div class="st-load">Считаем…</div>`;
 const uq=(a,b)=>{let q=db.from('users').select('*',{count:'exact',head:true}).gte('created_at',new Date(a+'T00:00:00').toISOString()).lte('created_at',new Date(b+'T23:59:59').toISOString());if(city!=='all')q=q.eq('city',city);return q.then(r=>r.count).catch(()=>null);};
 const [s,p,dr,u1,u0,tgs]=await Promise.all([
  api('/api/admin',{action:'rides-stats',from:statFrom,to:statTo,city}),
  api('/api/admin',{action:'rides-stats',from:pFrom,to:pTo,city}).catch(()=>null),
  api('/api/admin',{action:'drivers-stats',from:statFrom,to:statTo,city,vehicle:'all'}).catch(()=>null),
  uq(statFrom,statTo),uq(pFrom,pTo),
  api('/api/admin',{action:'tg-stats',from:statFrom,to:statTo,city}).catch(()=>null)
 ]);
 if(!ACTfun){await loadActivity().catch(()=>{});}
 if(tok!==stTok||aTab!=='stat'||role!=='admin')return;
 if(!s||s.error){m.innerHTML=head()+stControls()+'<div class="empty"><b>Не удалось загрузить</b>Проверьте интернет и откройте ещё раз.</div>';return;}
 if(city==='all')stCityList=Object.keys(s.byCity||{}).filter(c=>c&&c!=='—').sort((a,b)=>s.byCity[b].total-s.byCity[a].total);
 const pv=p&&!p.error?p:null;
 stData={s,len};
 const cmp=ST_CMP[stPer]||ST_CMP.custom;
 const conv=s.total?Math.round(s.completed/s.total*100):0;

 // 1. главное
 const kpis=`<div class="st-kpis">
  ${stKpi('Заявок',s.total,pv?pv.total:null,'','сколько раз вызывали машину')}
  ${stKpi('Поездок',s.completed,pv?pv.completed:null,'',s.total?`довезли ${conv}% заявок`:'довезли пассажиров')}
  ${stKpi('Заработали водители',s.money,pv?pv.money:null,' ₽','сумма всех поездок')}
  ${stKpi('Новых людей',u1||0,u0,'','зашли в приложение впервые')}
 </div>
 ${pv?`<div class="st-cmpnote">Сравниваем с периодом «${cmp}» — ${stPeriodText(pFrom,pTo)}</div>`:''}`;

 // 2. что стало с заявками
 const F=[
  ['done','Доехали','заказ выполнен',s.completed,'var(--g)'],
  ['now','Сейчас в работе','ищут машину или уже едут',(s.inProgress||0)+(s.waitingNow||0),'var(--blue)'],
  ['not_picked','Не выбрали водителя','цены были, но пассажир не согласился',s.hadOffersNotTaken,'var(--am)'],
  ['no_offers','Никто не откликнулся','водители не прислали ни одной цены',s.noOffers,'var(--red)'],
  ['cancel_passenger','Отменил пассажир','передумал или уехал по-другому',s.cancelPassenger,'var(--dim)'],
  ['cancel_driver','Отказался водитель','взял заказ, а потом отменил',s.cancelDriver,'#b5484a']
 ];
 const lostF=F.slice(2).filter(f=>f[3]>0).sort((a,b)=>b[3]-a[3]);
 const lost=F.slice(2).reduce((a,f)=>a+f[3],0);
 const pc=n=>s.total?Math.round(n/s.total*100):0;
 const say=!s.total?'За этот период заявок не было.'
  :(s.total>=10?`Из каждых 10 заявок доезжают <b>${Math.round(s.completed/s.total*10)}</b>.`:`Доехали <b>${s.completed}</b> из ${s.total} ${plural(s.total,['заявки','заявок','заявок'])}.`)
   +(lostF.length?` Чаще всего теряем, когда «${lostF[0][1].toLowerCase()}» — ${lostF[0][3]} ${plural(lostF[0][3],['раз','раза','раз'])}.`:(s.total?' Потерь нет.':''));
 const fates=`<div class="st-card">
  <div class="st-ct"><h3>Что стало с заявками</h3><span>${s.total} ${plural(s.total,['заявка','заявки','заявок'])}</span></div>
  ${s.total?`<div class="st-stack">${F.filter(f=>f[3]>0).map(f=>`<i style="width:${Math.max(1.5,f[3]/s.total*100)}%;background:${f[4]}"></i>`).join('')}</div>`:''}
  <div class="st-say">${say}</div>
  ${F.filter(f=>f[3]>0).map(f=>`<div class="st-row" onclick="statRides('${f[0]}','${f[1]}')">
    <span class="dot" style="background:${f[4]}"></span>
    <div class="t"><b>${f[1]}</b><span>${f[2]}</span></div>
    <div class="n">${f[3]}<span>${pc(f[3])}%</span></div>
    <svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
   </div>`).join('')}
  ${s.total?`<div class="st-btns"><button onclick="statRides('all','Все заявки')">Все заявки списком</button>${lost?`<button class="bad" onclick="statRides('lost','Потерянные заявки')">Только потерянные · ${lost}</button>`:''}</div>`:''}
 </div>`;

 // 3. когда заказывают
 const chart=`<div class="st-card">
  <div class="st-ct"><h3>Когда заказывают</h3></div>
  ${len>1?`<div class="st-mini"><div class="${stChart==='days'?'on':''}" onclick="stChart='days';stSel=null;stDrawChart()">По дням</div><div class="${stChart==='hours'?'on':''}" onclick="stChart='hours';stSel=null;stDrawChart()">По часам</div></div>`:''}
  <div id="stch"></div>
 </div>`;

 // 4. водители
 const all=(dr&&dr.items)||[];
 const work=all.filter(d=>d.taken>0).sort((a,b)=>b.money-a.money||b.done-a.done);
 const top=work.slice(0,5);
 const mx=Math.max(1,...top.map(d=>d.money));
 const onl=all.filter(d=>d.online).length;
 const agoD=d=>d.last?Math.floor((Date.now()-new Date(d.last).getTime())/864e5):null;
 const sleep=all.filter(d=>{const a=agoD(d);return a===null||a>=30;});
 const deaf=all.filter(d=>d.got>=5&&d.ans===0);
 const drv=`<div class="st-card">
  <div class="st-ct"><h3>Водители</h3><span>брали заказы ${work.length} из ${all.length}</span></div>
  <div class="st-chips"><span><i class="g"></i>на линии сейчас — ${onl}</span>${work.length?`<span>в среднем ${stFmt(Math.round(s.completed/Math.max(1,work.length)*10)/10)} ${plural(Math.round(s.completed/Math.max(1,work.length)),['поездка','поездки','поездок'])} на водителя</span>`:''}</div>
  ${top.length?top.map((d,i)=>`<div class="st-drv" onclick="statGo('days','${d.id}')">
    <span class="rk">${i+1}</span>
    <div class="t"><b>${esc(d.name)}${d.online?' <i class="on"></i>':''}</b><span>${d.done} ${plural(d.done,['поездка','поездки','поездок'])}${d.cancelled?` · отказов ${d.cancelled}`:''}${d.react!==null&&d.react!==undefined?` · отвечает на ${d.react}% заявок`:''}</span>
     <div class="bar"><i style="width:${Math.max(3,Math.round(d.money/mx*100))}%"></i></div></div>
    <div class="m">${stFmt(d.money)} ₽</div>
   </div>`).join(''):'<div class="st-empty">За этот период никто не взял ни одного заказа</div>'}
  ${deaf.length?`<div class="st-warn bad" onclick="drvGrp='mute';statGo('drivers')"><b>${deaf.length} ${plural(deaf.length,['водитель получает','водителя получают','водителей получают'])} заявки и ни разу не ответил</b><span>${deaf.slice(0,3).map(d=>esc(d.name)).join(', ')} — возможно, бот у них выключен</span></div>`:''}
  ${sleep.length?`<div class="st-warn" onclick="drvGrp='mute';statGo('drivers')"><b>${sleep.length} ${plural(sleep.length,['водитель не брал','водителя не брали','водителей не брали'])} заказы больше месяца</b><span>${sleep.slice(0,4).map(d=>esc(d.name)).join(', ')}</span></div>`:''}
  <div class="st-btns"><button onclick="drvGrp='all';statGo('drivers')">Все водители подробно</button></div>
 </div>`;

 // 5. качество
 const ic={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',rub:'<path d="M8 21V4h5.5a4.5 4.5 0 0 1 0 9H6M6 17h8"/>',chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',hand:'<path d="M7 11V6a2 2 0 0 1 4 0v5M11 10V4a2 2 0 0 1 4 0v6M15 10V6a2 2 0 0 1 4 0v7a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.4L3 13a2 2 0 0 1 3.4-2L7 12"/>',bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01"/>'};
 const q=[];
 if(s.avgWait!==null&&s.avgWait!==undefined)q.push(['clock',`Водителя находят за ~${s.avgWait} мин`,'от заявки до момента, когда пассажир выбрал водителя',s.avgWait>15?'am':'']);
 if(s.completed)q.push(['rub',`Средняя поездка — ${stFmt(s.avgCheck)} ₽`,'сумма поездок, делённая на их число','']);
 if(s.total)q.push(['chat',`На заявку приходит ${String(s.avgOffers).replace('.',',')} ${plural(Math.ceil(s.avgOffers)||0,['цена','цены','цен'])}`,'сколько водителей в среднем откликается',s.avgOffers<1?'am':'']);
 if(s.total)q.push(['hand',`${pc(s.withPrice)}% пассажиров сами назвали цену`,`${s.withPrice} из ${s.total} заявок`,'']);
 if(s.autoClosed)q.push(['bot',`${s.autoClosed} ${plural(s.autoClosed,['поездку','поездки','поездок'])} закрыл бот`,'водитель не нажал «Завершить» — стоит напомнить',s.completed&&s.autoClosed/s.completed>=.5?'am':'']);
 const qual=q.length?`<div class="st-card">
  <div class="st-ct"><h3>Как работает сервис</h3></div>
  ${q.map(x=>`<div class="st-q ${x[3]}"><svg viewBox="0 0 24 24">${ic[x[0]]}</svg><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join('')}
 </div>`:'';

 // 6. виды заказов и города
 const K=s.byKind||{ride:0,delivery:0,intercity:0};
 const kinds=s.total?`<div class="st-card">
  <div class="st-ct"><h3>Что заказывают</h3></div>
  <div class="st-kinds">
   <div><b>${K.ride}</b><span>поездки по городу</span><i>${pc(K.ride)}%</i></div>
   <div><b>${K.delivery}</b><span>доставка</span><i>${pc(K.delivery)}%</i></div>
   <div><b>${K.intercity}</b><span>межгород</span><i>${pc(K.intercity)}%</i></div>
  </div>
  ${statCity==='all'&&Object.keys(s.byCity||{}).length>1?`<div class="st-sub2">По городам</div>${Object.entries(s.byCity).sort((a,b)=>b[1].total-a[1].total).map(([c,v])=>`<div class="st-city" onclick="stSetCity('${esc(c)}')"><div class="cn"><b>${esc(c)}</b><span>${v.total} ${plural(v.total,['заявка','заявки','заявок'])} · доехали ${v.total?Math.round(v.done/v.total*100):0}% · ${stFmt(v.money)} ₽</span></div><div class="ct"><i style="width:${Math.max(3,Math.round(v.total/s.total*100))}%"></i></div></div>`).join('')}`:''}
 </div>`:'';

 // 7. путь людей — за всё время
 const f=ACTfun;
 const pp=(a,b)=>b?Math.round(a/b*100):0;
 const fun=f&&f.total?`<div class="st-card">
  <div class="st-ct"><h3>Путь людей</h3><span>за всё время</span></div>
  ${[['Зашли в приложение',f.total,100],['Создали заявку',f.ordered,pp(f.ordered,f.total)],['Доехали хотя бы раз',f.arrived,pp(f.arrived,f.total)],['Заказали ещё раз',f.repeat,pp(f.repeat,f.total)],['Заказывают постоянно',f.loyal,pp(f.loyal,f.total)]].map((r,i)=>`<div class="st-fn"><div class="l">${r[0]}</div><div class="b"><i style="width:${Math.max(2,r[2])}%;opacity:${1-i*.14}"></i></div><div class="v">${stFmt(r[1])}<span>${r[2]}%</span></div></div>`).join('')}
  ${f.total-f.ordered>0?`<div class="st-warn" onclick="aGo('ppl')"><b>${stFmt(f.total-f.ordered)} ${plural(f.total-f.ordered,['человек зашёл','человека зашли','человек зашли'])} и ни разу не заказали</b><span>Их список — во вкладке «Люди» → «Ни разу». Часто заходили, когда машин на линии не было</span></div>`:''}
 </div>`:'';

 m.innerHTML=head()+stControls()+kpis+fates+chart+drv+qual+kinds+stTgCard(tgs)+fun+'<div style="height:24px"></div>';
 stDrawChart();
}

// группы и бот: кто вступил, кто вышел, кто пришёл в бота
function stTgCard(t){
 if(!t||t.error)return '';
 if(t.missing)return `<div class="st-card"><div class="st-ct"><h3>Группы и бот</h3></div><div class="st-empty">Журнал ещё не включён: нужно выполнить в Supabase файл db-26-tg-events.sql.</div></div>`;
 const G=(t.groups||[]).slice().sort((a,b)=>(a.type===b.type?0:a.type==='city'?-1:1)||(b.join-a.join));
 const since=t.since?ldstr(new Date(t.since)):null;
 const note=!since?'Записи появятся, когда кто-нибудь вступит в группу или нажмёт /start в боте.'
  :(since>statFrom?`Записываем с ${stDayTxt(since)} — раньше данных нет.`:'');
 const ago=x=>new Date(x).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 const what=e=>e.kind==='join'?`вступление в ${e.type==='drivers'?'группу водителей':'группу'} ${esc(e.city||'')}`
  :e.kind==='leave'?`выход из ${e.type==='drivers'?'группы водителей':'группы'} ${esc(e.city||'')}`
  :(e.is_new?'новый в боте':'снова зашёл в бота');
 const col=e=>e.kind==='join'?'var(--g)':e.kind==='leave'?'var(--red)':(e.is_new?'var(--blue)':'var(--dim2)');
 return `<div class="st-card">
  <div class="st-ct"><h3>Группы и бот</h3></div>
  ${note?`<div class="st-cmpnote" style="padding:2px 0 8px">${note}</div>`:''}
  ${G.length?G.map(g=>{const net=g.join-g.leave;return `<div class="st-row" style="cursor:default">
    <span class="dot" style="background:${g.type==='drivers'?'var(--am)':'var(--g)'}"></span>
    <div class="t"><b>${g.type==='drivers'?'Водители · ':'Группа · '}${esc(g.city)}</b><span>вступили ${g.join} · вышли ${g.leave}</span></div>
    <div class="n" style="color:${net>0?'var(--g)':net<0?'var(--red)':'inherit'}">${net>0?'+':''}${net}<span>за период</span></div>
   </div>`;}).join(''):'<div class="st-empty" style="padding-top:4px">В группы за этот период никто не вступал и не выходил.</div>'}
  <div class="st-kinds" style="margin-top:12px">
   <div><b>${t.startsNew||0}</b><span>новых пришли в бота</span><i>всего /start: ${t.starts||0}</i></div>
   <div><b>${t.opened||0}</b><span>из них открыли приложение</span><i>${t.startsNew?Math.round(t.opened/t.startsNew*100):0}%</i></div>
   <div><b>${t.ordered||0}</b><span>сделали заявку</span><i>${t.startsNew?Math.round(t.ordered/t.startsNew*100):0}%</i></div>
  </div>
  ${(t.recent||[]).length?`<div class="st-sub2">Последние</div>${t.recent.slice(0,15).map(e=>`<div class="st-ev">
    <i style="background:${col(e)}"></i>
    <div class="t"><b>${esc(e.name)||'Без имени'} <span class="idtag">#${esc(e.tag)}</span></b><span>${what(e)}${e.source?' · '+esc(e.source):''}</span></div>
    <span class="tm">${ago(e.created_at)}</span>
   </div>`).join('')}`:''}
 </div>`;
}
// график: по дням (заявки и поездки) или по часам
function stDrawChart(){
 const box=document.getElementById('stch');
 if(!box||!stData)return;
 document.querySelectorAll('.st-mini div').forEach((e,i)=>e.classList.toggle('on',(i===0)===(stChart==='days')));
 const {s,len}=stData;
 if(stChart==='hours'||len===1){
  const H=s.byHour||Array(24).fill(0);
  const mxh=Math.max(1,...H),sumH=H.reduce((a,b)=>a+b,0);
  const peak=H.indexOf(Math.max(...H));
  const part=(a,b)=>sumH?Math.round(H.slice(a,b).reduce((x,y)=>x+y,0)/sumH*100):0;
  const sel=stSel!==null&&stSel>=0&&stSel<24?stSel:null;
  box.innerHTML=`<div class="st-bars h">${H.map((v,i)=>`<div class="c ${v===mxh&&v?'pk':''} ${sel===i?'sel':''}" onclick="stSel=${i};stDrawChart()"><i style="height:${v?Math.max(4,Math.round(v/mxh*100)):0}%"></i></div>`).join('')}</div>
  <div class="st-ax">${H.map((v,i)=>`<span>${i%3===0?i:''}</span>`).join('')}</div>
  <div class="st-tip">${sel!==null?`<b>${String(sel).padStart(2,'0')}:00–${String(sel+1).padStart(2,'0')}:00</b> — ${H[sel]} ${plural(H[sel],['заявка','заявки','заявок'])}`
   :sumH?`Больше всего заявок в <b>${String(peak).padStart(2,'0')}:00–${String(peak+1).padStart(2,'0')}:00</b>. Утром с 6 до 10 — ${part(6,10)}%, вечером с 16 до 21 — ${part(16,21)}%.`:'Заявок не было'}</div>`;
  return;
 }
 const rows=[];const st=new Date(statFrom+'T12:00:00');
 for(let i=0;i<len&&i<120;i++){const k=ldstr(new Date(st.getTime()+i*864e5));const v=(s.byDay||{})[k]||{total:0,done:0,lost:0,money:0};rows.push({k,...v});}
 const mxd=Math.max(1,...rows.map(r=>r.total));
 const few=rows.length<=10;
 const sel=stSel!==null&&rows[stSel]?stSel:null;
 const best=rows.slice().sort((a,b)=>b.total-a.total)[0];
 const empty=rows.filter(r=>!r.total).length;
 box.innerHTML=`<div class="st-bars d ${few?'few':''}">${rows.map((r,i)=>{const wd=new Date(r.k+'T12:00:00').getDay();return `<div class="c ${wd===0||wd===6?'we':''} ${sel===i?'sel':''}" onclick="stSel=${i};stDrawChart()">${few&&r.total?`<em>${r.total}</em>`:''}<i style="height:${r.total?Math.max(4,Math.round(r.total/mxd*100)):0}%"><u style="height:${r.total?Math.round(r.done/r.total*100):0}%"></u></i></div>`;}).join('')}</div>
 <div class="st-ax">${rows.map((r,i)=>{const d=new Date(r.k+'T12:00:00');const show=few||i%5===0||i===rows.length-1;return `<span class="${d.getDay()===0||d.getDay()===6?'we':''}">${show?(few?ST_WD[d.getDay()]+'<br>'+d.getDate():d.getDate()):''}</span>`;}).join('')}</div>
 <div class="st-legend"><span><i class="a"></i>доехали</span><span><i class="b"></i>остальные заявки</span><span class="we">выходные</span></div>
 <div class="st-tip">${sel!==null?`<b>${stDayTxt(rows[sel].k,true)}</b> — ${rows[sel].total} ${plural(rows[sel].total,['заявка','заявки','заявок'])}, доехали ${rows[sel].done}, ${stFmt(rows[sel].money)} ₽`
  :best&&best.total?`Больше всего заявок — <b>${stDayTxt(best.k,true)}</b>: ${best.total}.${empty?` Дней без заявок: ${empty}.`:''} Нажмите на столбик, чтобы увидеть день.`:'Заявок не было'}</div>`;
}
// список заявок по исходу (исход считаем здесь — так же, как в сводке)
const ST_FATE={done:['Доехал','var(--g)'],going:['Едет сейчас','var(--blue)'],waiting:['Ищет машину','var(--blue)'],no_offers:['Никто не откликнулся','var(--red)'],
 not_picked:['Не выбрал водителя','var(--am)'],cancel_passenger:['Отменил пассажир','var(--dim)'],cancel_driver:['Отказался водитель','#b5484a'],other:['Другое','var(--dim)']};
function stFateOf(x){
 if(x.fate)return x.fate;
 const st=String(x.status||'');
 if(st==='completed')return 'done';
 if(st==='confirmed'||st==='in_progress')return 'going';
 if(st==='created')return (Date.now()-new Date(x.created_at).getTime()<30*60000)?'waiting':(x.offers?'not_picked':'no_offers');
 if(st.includes('cancelled'))return st.includes('driver')?'cancel_driver':'cancel_passenger';
 return 'other';
}

 c.innerHTML=`

 ${actors.length>1?`<div class="sec" style="padding-bottom:4px">Чьи действия показать</div>

   <div class="${!logActor?'on':''}" onclick="logActor=null;aFin(document.getElementById('main'))">Все</div>

 ${items.length?items.map(l=>{
   const t=new Date(l.created_at);
   const when=t.toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
   const what=ACT_RU[l.action]||('действие: '+String(l.action||'').replace(/-/g,' '));
   let det='';
   // новый формат: готовый текст с переносами
   if(l.details&&l.details.indexOf('{')!==0){
    det=l.details;
   }else{
   try{
    const d=l.details?JSON.parse(l.details):null;
    if(d){
     const parts=[];
     if(d.amount!==undefined)parts.push(d.amount>0?'+'+d.amount+' ₽':d.amount+' ₽');
     if(d.code)parts.push('код '+d.code);
     if(d.role)parts.push('роль: '+(roleRu[d.role]||d.role));
     if(d.status)parts.push('статус: '+d.status);
     if(d.value!==undefined)parts.push(d.value?'включено':'выключено');
     if(d.text)parts.push('«'+String(d.text).slice(0,60)+'»');
     if(d.note)parts.push(d.note);
     if(d.fields)parts.push(Object.keys(d.fields).join(', '));
     if(d.audience){
      const au={all:'всем',drivers:'водителям',passengers:'пассажирам',never:'кто не заказывал',ordered:'кто заказывал'};
      parts.push(au[d.audience]||d.audience);
     }
     if(d.city&&d.city!=='all')parts.push('город '+d.city);
     if(d.fields&&typeof d.fields==='object'){
      parts.length=0;
      Object.entries(d.fields).forEach(([k,v])=>{
       parts.push((FIELD_RU[k]||k)+': '+(v===true?'включено':v===false?'выключено':v));
      });
     }
     det=parts.join(' · ');
    }
   }catch(e){}
   }
   return `<div class="logrow">
    <div class="lgt">${when}</div>
    <div class="lgb"><b>${esc(l.actor_name)}</b> <span class="lgr">${roleRu[l.actor_role]||l.actor_role||''}</span><br>${what}${l.target_name?' → <b>'+esc(l.target_name)+'</b>':''}${det?`<div class="lgd">${esc(det).replace(/\n/g,'<br>')}</div>`:''}</div>
   </div>`;
  }).join(''):'<div class="empty"><b>Пока пусто</b>Здесь появится всё, что сделают администраторы и модераторы: начисления, баны, промокоды, изменения настроек.</div>'}
 <div style="height:20px"></div>`;
}

 await loadQRLib();
 if(window.QRCode&&window.QRCode.toCanvas){
  window.QRCode.toCanvas(canvas,text,{width:260,margin:1,color:{dark:'#0B0F0D',light:'#ffffff'}},err=>{
   if(err)qrFallback(canvas,text);

 }else qrFallback(canvas,text);
}

  const p=canvas.parentElement;
  if(p)p.innerHTML='<div style="color:#666;font-size:12px;padding:20px">Не удалось нарисовать код. Проверьте интернет.</div>';

}

async function loadPromos(){

 const el=document.getElementById('promolist');if(!el)return;
 const _r=await api('/api/admin',{action:'promo-list'});
 const data=_r.items||[];
 if(_r.error||!data.length){el.innerHTML='<div class="empty">Промокодов пока нет</div>';return;}
 const nm=_r.names||{};
 el.innerHTML=data.map(p=>{
  const exp=p.expires_at&&new Date(p.expires_at)<new Date();
  const st=p.used?'использован':exp?'истёк':'активен';
  const cl=p.used?'var(--dim)':exp?'var(--red)':'var(--g)';
  const gives=p.days>0?p.days+' дн':(p.amount>0?p.amount+' ₽':'—');
  const who=p.for_user?(nm[p.for_user]||'персональный'):'для всех';
  const author=p.created_by_name?esc(p.created_by_name):'система';
  const when=p.created_at?new Date(p.created_at).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  const usedBy=p.used&&p.used_by?(nm[p.used_by]||'кем-то'):'';
  return `<div class="card" style="flex-direction:column;align-items:stretch;gap:6px">
   <div style="display:flex;align-items:center;gap:10px">
    <div style="flex:1;min-width:0"><div class="nm" style="font-family:'Roboto Mono',monospace;font-size:15px">${esc(p.code)}</div>
    <div class="sub">даёт ${gives} · ${p.for_user?'🔒 '+esc(who):esc(who)} · <span style="color:${cl}">${st}</span></div></div>
    ${!p.used?`<button class="rolebtn" onclick="delPromo('${p.id}')">удалить</button>`:''}
   </div>
   <div class="sub" style="font-size:10.5px;opacity:.75">создал ${author}${when?' · '+when:''}${usedBy?' · использовал '+esc(usedBy):''}</div>
  </div>`;
 }).join('');
}

 ['all','Все',u=>true],

 ['pass','Пассажиры',u=>!pplIsDrv(u)],
 ['new','Новые за неделю',u=>u.created_at&&Date.now()-new Date(u.created_at).getTime()<7*864e5],

];
// все люди — постранично: база отдаёт не больше 1000 за раз
async function pplLoadAll(){
 const seen=new Map();
 for(let i=0;i<30;i++){
  const{data,error}=await db.from('users').select('*').order('created_at',{ascending:false}).range(i*1000,i*1000+999);
  if(error)break;
  let fresh=0;(data||[]).forEach(u=>{if(!seen.has(u.id)){seen.set(u.id,u);fresh++;}});
  if(!data||data.length<1000||!fresh)break;
 }
 return [...seen.values()];
}
const pplDate=d=>{if(!d)return '';const x=new Date(d);return x.toLocaleDateString('ru',x.getFullYear()===new Date().getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'}).replace(' г.','');};
function pplAgo(d){
 if(!d)return '';
 const days=Math.floor((Date.now()-new Date(d).getTime())/864e5);
 return days<=0?'сегодня':days===1?'вчера':days<7?days+' '+plural(days,['день','дня','дней'])+' назад':pplDate(d);
}
// чем занят человек — одной строкой
function pplWhat(u){
 const a=ACT[u.id]||{};
 if(pplIsDrv(u)){
  const bits=[esc(u.car)||'машина не указана'];
  if(a.drives)bits.push('возил '+a.drives+' '+plural(a.drives,['раз','раза','раз']));
  return bits.join(' · ');
 }
 if(!a.made)return '<span class="pp-dim">ещё не заказывал</span>';
 return `${a.made} ${plural(a.made,['заказ','заказа','заказов'])}${a.done?', доехал '+a.done:''}${a.last?' · последний '+pplAgo(a.last):''}`;
}
function pplPills(u){
 const p=[];
 if(u.is_banned)p.push('<span class="pp-pill red">бан</span>');
 if(pplIsStaff(u))p.push(`<span class="pp-pill am">${u.staff_role==='owner'?'владелец':u.staff_role==='admin'?'админ':'модератор'}</span>`);
 if(pplIsDrv(u))p.push('<span class="pp-pill g">водитель</span>');
 else if(u.driver_status==='pending')p.push('<span class="pp-pill am">ждёт проверки</span>');
 if(pplIsDrv(u)&&u.rank_code&&typeof rkPill==='function')p.push(rkPill(u.rank_code,u.rank_paused).replace('class="rkp','class="rkp pp-rk'));
 if(pplIsDrv(u)&&u.status==='online')p.push('<span class="pp-on">на линии</span>');
 return p.join('');
}

 </div>
 ${isD&&typeof canSee==='function'&&canSee('ranks')?`<button class="pp-link" onclick="closeSh();drvPtsSheet('${u.id}')">Звание и баллы<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>`:''}
 ${isD||u.driver_status==='pending'?`<div class="pp-sub">Машины <button class="rolebtn" onclick="adminAddCar('${u.id}')">+ добавить</button></div><div id="uccars"><div class="sub" style="padding:4px 0">загрузка…</div></div>`:''}
 ${(u.doc_license||u.doc_pts||u.doc_car)?`<div class="pp-sub">Документы</div><div class="docs" id="ucdocs">${[['doc_license','права'],['doc_pts','ПТС'],['doc_car','машина']].map(d=>u[d[0]]?`<div style="flex:1"><div class="docslot" data-k="${d[0]}"><div style="height:74px;border:1px dashed var(--line2);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:10px">загрузка…</div></div><div class="cap">${d[1]}</div></div>`:'').join('')}</div>`:''}
 <div class="pp-sec">Отзывы о нём · ${(rv||[]).length}</div>
 ${(rv||[]).length?rv.map(r=>rvRow(r,r.from_name)).join(''):'<div class="sub" style="padding:2px 0 6px">отзывов нет</div>'}
 ${(rvBy||[]).length?`<div class="pp-tog" onclick="this.nextElementSibling.classList.toggle('open');this.classList.toggle('open')">Его отзывы о других · ${rvBy.length}<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></div><div class="pp-fold">${rvBy.map(r=>rvRow(r,r.target_name)).join('')}</div>`:''}
 <div class="pp-tog" onclick="this.nextElementSibling.classList.toggle('open');this.classList.toggle('open')">Изменить данные<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></div>
 <div class="pp-fold">
  <div class="fr"><label>Имя в приложении</label><input id="e_name" value="${esc(u.name)}"></div>
  <div class="fr"><label>ФИО по документам</label><input id="e_full_name" value="" placeholder="загружается…"></div>
  <div class="fr"><label>Телефон</label><input id="e_phone" value="" placeholder="${u.has_phone?'загружается…':'не указан'}" inputmode="tel" maxlength="18" oninput="maskPhone(this)"></div>
  <div class="fr"><label>Возраст</label><input id="e_age" value="${u.age||''}" inputmode="numeric"></div>
  <div class="fr"><label>Где стоит</label><input id="e_spot" value="${esc(u.spot)}"></div>
  <div class="fr"><label>Рейтинг</label><input id="e_rating" value="${rating.toFixed(1)}" inputmode="decimal"></div>
  <div class="fr"><label>Баланс, ₽</label><input id="e_balance" value="${u.balance||0}" inputmode="numeric"></div>
  <div class="fr"><label>Кто в сервисе</label>${sel('e_role',u.role||'passenger',[['passenger','Пассажир'],['driver','Водитель'],['both','Водитель и пассажир']])}</div>
  <div class="fr"><label>Статус водителя</label>${sel('e_ds',u.driver_status||'none',[['none','Не водитель'],['pending','На проверке'],['approved','Одобрен'],['rejected','Отклонён']])}</div>
 </div>
 <div class="sa" style="flex-wrap:wrap">
  <button class="c" onclick="closeSh()">Закрыть</button>
  ${(canRole&&isOwner())?`<button class="c" onclick="closeSh();roleSheet('${u.id}','${esc(u.name)}','${u.staff_role||'none'}')">Роль</button>`:''}
  ${(canRole&&isOwner()&&u.staff_role&&u.staff_role!=='none'&&u.staff_role!=='owner')?`<button class="c" onclick="closeSh();permsSheet('${u.id}')">Разделы</button>`:''}
  <button class="c" style="color:${u.is_banned?'var(--g)':'var(--red)'};border-color:${u.is_banned?'var(--g)':'var(--red)'}!important" onclick="toggleBan('${u.id}',${!!u.is_banned})">${u.is_banned?'Разбанить':'Забанить'}</button>
  <button class="o" onclick="saveUser('${u.id}')">Сохранить</button>
 </div></div>`;
 document.getElementById('device').appendChild(m);
 if(u.doc_license||u.doc_pts||u.doc_car)loadDocs(id,'ucdocs').catch(()=>{});
 loadUserCars(id).catch(()=>{});
 (async()=>{
  try{
   if(!pplAvatars[id]){
    const r=await api('/api/admin',{action:'avatars',ids:[id]});
    if(r&&r.map&&r.map[id])pplAvatars[id]=r.map[id];
   }
   let why=null;
   if(!pplAvatars[id]){
    const f=await api('/api/admin',{action:'avatar-fetch',target_id:id});
    if(f&&f.url)pplAvatars[id]=f.url;else if(f&&f.why)why=f.why;
   }
   const el=document.getElementById('ucava');
   if(el&&pplAvatars[id])el.innerHTML=`<img src="${pplAvatars[id]}" alt="">`;
   const wh=document.getElementById('ucwhy');
   if(wh&&!pplAvatars[id]&&why)wh.textContent='фото: '+why;
  }catch(e){}
 })();
 api('/api/admin',{action:'user-phone',target_id:id}).then(r=>{
  if(!r||r.error)return;
  if(r.phone){
   const el=document.getElementById('ucphone');
   if(el){el.outerHTML=`<a class="ucbtn" href="tel:${esc(r.phone)}">\u{1F4DE} ${esc(r.phone)}</a>`;}
   const inp=document.getElementById('e_phone');
   if(inp)inp.value=r.phone;
  }
  if(r.full_name){
   const fn=document.getElementById('e_full_name');
   if(fn)fn.value=r.full_name;
   const hd=document.getElementById('ucfio');
   if(hd)hd.innerHTML=esc(r.full_name)+'<br>';
  }
 }).catch(()=>{});
}
function grantDriver(id,name,car,plate){
 const m=document.createElement('div');m.className='mask';m.id='sh2';
 m.innerHTML=`<div class="sheet"><h3>Сделать водителем</h3><div class="s">${esc(name)} получит доступ к заявкам и сможет выходить на линию. Впишите машину — её увидят пассажиры.</div>
 <div class="fr"><label>Марка машины</label><input id="gd_car" value="${esc(car)}" placeholder="Lada Vesta"></div>
 <div class="fr"><label>Гос. номер</label><input id="gd_plate" value="${esc(plate)}" placeholder="А123ВС"></div>
 <div class="sa"><button class="c" onclick="document.getElementById('sh2').remove()">Отмена</button><button class="o" onclick="doGrantDriver('${id}')">Выдать права</button></div></div>`;
 document.getElementById('device').appendChild(m);
}
function doGrantDriver(id){ return once('grantDrv',()=>_doGrantDriver(id)); }
async function _doGrantDriver(id){
 const car=(document.getElementById('gd_car').value||'').trim();
 const plate=(document.getElementById('gd_plate').value||'').trim();
 if(!car||!plate)return T('Впишите марку и номер');
 const r=await api('/api/admin',{action:'driver-status',target_id:id,status:'approved',car,plate});
 if(r.error)return T(r.error==='forbidden'?'Нет прав':'Ошибка');
 document.getElementById('sh2').remove();closeSh();T('Права водителя выданы');drawA();
}
function revokeDriver(id,name){
 const m=document.createElement('div');m.className='mask';m.id='sh2';
 m.innerHTML=`<div class="sheet"><h3>Снять права водителя</h3><div class="s">${esc(name)} больше не сможет выходить на линию и брать заявки. Останется обычным пассажиром. История поездок и отзывы сохранятся.</div>
 <div class="sa"><button class="c" onclick="document.getElementById('sh2').remove()">Отмена</button><button class="o" style="background:var(--red);border-color:var(--red);color:#fff" onclick="doRevokeDriver('${id}')">Снять права</button></div></div>`;
 document.getElementById('device').appendChild(m);
}
async function doRevokeDriver(id){
 const r=await api('/api/admin',{action:'driver-status',target_id:id,status:'none',revoke:true});
 if(r.error)return T(r.error==='forbidden'?'Нет прав':'Ошибка');
 document.getElementById('sh2').remove();closeSh();T('Права водителя сняты');drawA();
}
async function loadUserCars(uid){
 const box=document.getElementById('uccars');if(!box)return;
 const r=await api('/api/admin',{action:'cars-of-user',target_id:uid});
 const items=r.items||[];
 if(!items.length){box.innerHTML='<div class="sub" style="padding:4px 0 8px">машин нет</div>';return;}
 box.innerHTML=items.map(c=>`<div class="carrow ${c.is_active?'act':''}">
  ${c.photo_url?`<a href="${c.photo_url}" target="_blank"><img src="${c.photo_url}" style="width:52px;height:40px;object-fit:cover;border-radius:8px"></a>`:''}
  ${c.lic_url?`<a href="${c.lic_url}" target="_blank"><img src="${c.lic_url}" style="width:52px;height:40px;object-fit:cover;border-radius:8px"></a>`:''}
  ${c.pts_url?`<a href="${c.pts_url}" target="_blank"><img src="${c.pts_url}" style="width:52px;height:40px;object-fit:cover;border-radius:8px"></a>`:''}
  <div style="flex:1;min-width:0">
   <div style="font-size:14px;font-weight:600">${c.kind==='moto'?'🏍 ':''}${esc(c.brand)}</div>
   <div style="font-size:11.5px;color:var(--dim);margin-top:3px"><span class="plate">${esc(c.plate)}</span>${c.is_active?' <span style="color:var(--g)">· рабочая</span>':''}${!c.approved?' <span style="color:var(--am)">· ждёт проверки</span>':''}</div>
  </div>
  ${!c.approved?`<button class="rolebtn" style="color:var(--g)" onclick="approveCar('${c.id}','${uid}')">одобрить</button>`:''}
  <button class="rolebtn" onclick="carEdit('${c.id}','${uid}','${esc(c.brand)}','${esc(c.plate)}')">изменить</button>
  <button class="rolebtn" style="color:var(--red)" onclick="removeCar('${c.id}','${uid}')">удалить</button>
 </div>`).join('');
}
function carEdit(cid,uid,brand,plate){
 const m=document.createElement('div');m.className='mask';m.id='sh2';
 m.innerHTML=`<div class="sheet"><h3>Изменить транспорт</h3><div class="s">Если это рабочая машина водителя, марка и номер сразу обновятся у пассажиров.</div>
 <div class="fr"><label>Марка и модель</label><input id="ce_brand" value="${esc(brand)}"></div>
 <div class="fr"><label>Гос. номер</label><input id="ce_plate" value="${esc(plate)}" style="text-transform:uppercase"></div>
 <div class="sa"><button class="c" onclick="document.getElementById('sh2').remove()">Отмена</button><button class="o" onclick="doCarEdit('${cid}','${uid}')">Сохранить</button></div></div>`;
 document.getElementById('device').appendChild(m);
}
async function doCarEdit(cid,uid){
 const brand=(document.getElementById('ce_brand').value||'').trim();
 const plate=(document.getElementById('ce_plate').value||'').trim().toUpperCase();
 if(!brand||!plate)return T('Впишите марку и номер');
 const r=await api('/api/admin',{action:'car-edit',car_id:cid,brand,plate});
 if(r.error)return T('Ошибка');
 document.getElementById('sh2').remove();T('Изменено');loadUserCars(uid);
}
async function approveCar(cid,uid){
 const r=await api('/api/admin',{action:'car-approve',car_id:cid});
 if(r.error)return T('Ошибка');
 T('Машина одобрена');loadUserCars(uid);
}
async function removeCar(cid,uid){
 const r=await api('/api/admin',{action:'car-remove',car_id:cid});
 if(r.error)return T('Ошибка');
 T('Машина удалена');loadUserCars(uid);
}
function adminAddCar(uid){
 const m=document.createElement('div');m.className='mask';m.id='sh2';
 m.innerHTML=`<div class="sheet"><h3>Добавить транспорт</h3><div class="s">Добавленный вами транспорт сразу считается проверенным.</div>
 <div class="tabsw" style="margin-bottom:12px">
  <div class="on" id="ak_car" onclick="window._akKind='car';this.classList.add('on');document.getElementById('ak_moto').classList.remove('on')">🚗 Машина</div>
  <div id="ak_moto" onclick="window._akKind='moto';this.classList.add('on');document.getElementById('ak_car').classList.remove('on')">🏍 Мотоцикл</div>
 </div>
 <div class="fr"><label>Марка и модель</label><input id="ac_brand" placeholder="Lada Vesta"></div>
 <div class="fr"><label>Гос. номер</label><input id="ac_plate" placeholder="А123ВС" style="text-transform:uppercase"></div>
 <div class="sa"><button class="c" onclick="document.getElementById('sh2').remove()">Отмена</button><button class="o" onclick="doAdminAddCar('${uid}')">Добавить</button></div></div>`;
 window._akKind='car';
 document.getElementById('device').appendChild(m);
}
async function doAdminAddCar(uid){
 const brand=(document.getElementById('ac_brand').value||'').trim();
 const plate=(document.getElementById('ac_plate').value||'').trim().toUpperCase();
 if(!brand||!plate)return T('Впишите марку и номер');
 const r=await api('/api/admin',{action:'car-add-admin',target_id:uid,brand,plate,kind:window._akKind||'car'});
 if(r.error)return T('Ошибка');
 document.getElementById('sh2').remove();T('Машина добавлена');loadUserCars(uid);
}
async function saveUser(id){
 const g=x=>document.getElementById('e_'+x).value.trim();
 const fields={name:g('name'),full_name:g('full_name'),admin_note:g('admin_note'),phone:g('phone'),age:parseInt(g('age'))||null,spot:g('spot'),rating:parseFloat(g('rating'))||5,role:g('role')||'passenger',driver_status:g('ds')||'none',balance:parseFloat(g('balance'))||0};
 const r=await api('/api/admin',{action:'edit-user',target_id:id,fields});
 if(r.error)return T(r.error==='forbidden'?'Нет прав':'Ошибка: '+r.error);
 closeSh();T('Изменения сохранены');drawA();
}
async function toggleBan(id,now){
 const r=await api('/api/admin',{action:'ban',target_id:id,value:!now});
 if(r.error)return T('Ошибка: '+r.error);
 closeSh();T(now?'Разблокирован':'Заблокирован');drawA();
}
async function delRev(rid,uid){
 const r=await api('/api/admin',{action:'del-review',review_id:rid,target_id:uid});
 if(r.error)return T('Ошибка: '+r.error);
 T('Отзыв удалён');closeSh();userCard(uid);
}
function roleSheet(id,name,cur){
 let sel=cur;
 const opts=me.staff_role==='owner'
   ? [['none','Без прав','обычный пользователь'],['moderator','Модератор','жалобы и заявки водителей'],['admin','Админ','всё + назначение модераторов']]
   : [['none','Без прав','обычный пользователь'],['moderator','Модератор','жалобы и заявки водителей']];
 const m=document.createElement('div');m.className='mask';m.id='sh';
 m.innerHTML=`<div class="sheet"><h3>Права · ${name}</h3><div class="s">Выберите уровень доступа и подтвердите</div><div id="ol"></div><div class="sa"><button class="c" onclick="closeSh()">Отмена</button><button class="o" onclick="applyRole('${id}')">Подтвердить</button></div></div>`;
 document.getElementById('device').appendChild(m);
 const draw=()=>{document.getElementById('ol').innerHTML=opts.map(o=>`<div class="opt ${o[0]===sel?'sel':''}" onclick="window._sr('${o[0]}')"><div class="rd"></div><div class="tx">${o[1]}<small>${o[2]}</small></div></div>`).join('');};
 window._sr=v=>{sel=v;draw();};window._srGet=()=>sel;draw();
}
async function applyRole(id){
 const v=window._srGet();
 const r=await api('/api/admin',{action:'set-role',target_id:id,role:v});
 if(r.error)return T(r.error==='forbidden'?'Только владелец может менять права':'Ошибка');
 closeSh();T(v==='none'?'Права сняты':'Назначен: '+(v==='admin'?'админ':'модератор'));
 if(v!=='none'){setTimeout(()=>permsSheet(id),350);return;}
 drawA();
}

// ===== какие разделы открыты человеку =====
async function permsSheet(id){
 const r=await api('/api/admin',{action:'perms-get',target_id:id});
 if(r.error)return T(r.error==='forbidden'?'Только владелец':'Не удалось загрузить');
 if(r.owner)return T('У владельца всегда все разделы');
 const old=document.getElementById('sh');if(old)old.remove();
 window._pset=new Set(r.perms||[]);
 const g=r.groups||{};
 const rows=Object.keys(g).map(k=>
  `<div class="opt ${window._pset.has(k)?'sel':''}" data-k="${k}" onclick="togPerm('${k}')">
    <div class="rd"></div><div class="tx">${esc(g[k])}</div></div>`).join('');
 const m=document.createElement('div');m.className='mask';m.id='sh';
 m.innerHTML=`<div class="sheet"><h3>Разделы · ${esc(r.name||'')}</h3>
  <div class="s">Отметьте, что человек может делать. Всё остальное он даже не увидит.</div>
  <div id="pl" style="max-height:46vh;overflow-y:auto">${rows}</div>
  <div class="sa"><button class="c" onclick="closeSh();drawA()">Отмена</button>
  <button class="o" onclick="savePerms('${id}')">Сохранить</button></div></div>`;
 document.getElementById('device').appendChild(m);
}
function togPerm(k){
 if(window._pset.has(k))window._pset.delete(k); else window._pset.add(k);
 const el=document.querySelector('#pl .opt[data-k="'+k+'"]');
 if(el)el.classList.toggle('sel',window._pset.has(k));
}
async function savePerms(id){
 const list=[...window._pset];
 const r=await api('/api/admin',{action:'perms-set',target_id:id,perms:list});
 if(r.error)return T(r.error==='forbidden'?'Только владелец':'Не удалось сохранить');
 closeSh();T(list.length?'Открыто разделов: '+list.length:'Все разделы закрыты');drawA();
}
document.addEventListener('visibilitychange',async()=>{
 if(document.visibilityState!=='visible'||!me||role!=='passenger')return;
 try{
  const dayAgo=new Date(Date.now()-24*3600*1000).toISOString();
  const{data:fin}=await db.from('rides').select('*').eq('passenger_id',me.id).eq('status','completed').gte('created_at',dayAgo).order('created_at',{ascending:false}).limit(1);
  if(fin&&fin.length&&fin[0].driver_id&&!document.getElementById('sh')){
   const{data:rev}=await db.from('reviews').select('id').eq('ride_id',fin[0].id).eq('from_id',me.id).limit(1);
   if(!rev||!rev.length){active=null;passengerDone(fin[0]);}
  }
 }catch(e){}
});
boot();
</script>
</body>
</html>
