<!-- библиотека базы лежит рядом с приложением: не зависим от чужих CDN,
     которые бывают недоступны у части операторов и через VPN -->
<script src="./supabase.js" onerror="window.__sbFail=1"></script>

<script>
// библиотека обязательна. если основной источник недоступен —
// перебираем запасные и только потом сдаёмся
window.__libReady = (function(){
  var MIRRORS = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://cdn.skypack.dev/@supabase/supabase-js@2',
    'https://esm.sh/@supabase/supabase-js@2?bundle'
  ];
  function has(){ return !!(window.supabase && window.supabase.createClient); }
  function load(url){
    return new Promise(function(res){
      var s = document.createElement('script');
      s.src = url; s.crossOrigin = 'anonymous';
      s.onload = function(){ res(has()); };
      s.onerror = function(){ res(false); };
      document.head.appendChild(s);
      setTimeout(function(){ res(has()); }, 6000);
    });
  }
  return (async function(){
    if (has()) return true;
    // основной скрипт мог ещё грузиться — подождём немного
    for (var i = 0; i < 12; i++){
      if (has()) return true;
      await new Promise(function(r){ setTimeout(r, 250); });
    }
    for (var j = 0; j < MIRRORS.length; j++){
      if (await load(MIRRORS[j])) return true;
    }
    return has();
  })();
})();
</script>
<style>
:root{--bg:#080c0a;--elev:#080c0a;--surf:#121714;--card2:#171e19;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.11);--ink:#ffffff;--dim:#8b948f;--dim2:#5e6763;--g:#2bbd66;--g2:#22a256;--gs:rgba(47,208,111,.12);--am:#eda13a;--gold:#e8b84b;--blue:#5aa9f0;--red:#e2585a;--sh:none;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#070a09;font-family:Golos Text,sans-serif;color:var(--ink);display:flex;justify-content:center;}
.device{width:100%;max-width:430px;height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;}
.checker{height:5px;flex-shrink:0;background-image:linear-gradient(45deg,var(--ink) 25%,transparent 25%),linear-gradient(-45deg,var(--ink) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--ink) 75%),linear-gradient(-45deg,transparent 75%,var(--ink) 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0;opacity:.08;}
.rsw{display:flex;gap:5px;padding:8px 14px;background:var(--elev);border-bottom:1px solid var(--line);flex-shrink:0;}
.rb{flex:1;text-align:center;padding:8px;border-radius:9px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;border:1px solid transparent;}
.rb.on{background:var(--surf);border-color:var(--line2);color:var(--g);}
.top{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--elev);border-bottom:1px solid var(--line);flex-shrink:0;}
.brand{font-family:Golos Text,sans-serif;font-weight:700;font-size:20px;letter-spacing:1.5px;text-transform:uppercase;}
.brand em{font-style:normal;color:var(--g);}
.pill{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--line);padding:6px 12px;border-radius:100px;font-size:12px;color:var(--dim);}
.pill b{font-family:'Roboto Mono',monospace;color:var(--ink);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--g);animation:s 1.8s infinite;}
@keyframes s{0%,100%{opacity:1}50%{opacity:.4}}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.head{padding:16px 18px 4px;display:flex;align-items:baseline;justify-content:space-between;}
.head h2{font-family:Golos Text,sans-serif;font-weight:600;font-size:16px;letter-spacing:.6px;text-transform:uppercase;}
.head .m{font-size:11.5px;color:var(--dim);font-family:'Roboto Mono',monospace;}
.hero{padding:14px 14px 4px;}
.hgrid{display:flex;gap:10px;}
.hs{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--sh);}
.hs .n{font-family:'Roboto Mono',monospace;font-weight:700;font-size:24px;line-height:1;}
.hs .n.g{color:var(--g);}.hs .n.a{color:var(--am);}
.hs .l{font-size:11.5px;color:var(--dim);margin-top:6px;}
.cta{width:100%;margin-top:11px;background:var(--g);color:#06120b;border:none;border-radius:15px;padding:16px;font-family:Golos Text,sans-serif;font-weight:600;font-size:15px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;}
.cta:active{transform:scale(.98);}
.list{padding:8px 14px 24px;}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;animation:in .3s;}
.card.tap{cursor:pointer;}.card.tap:active{transform:scale(.98);}

.ava{width:46px;height:46px;border-radius:14px;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;font-family:Golos Text,sans-serif;font-weight:700;font-size:18px;color:#06120b;}
.nm{font-size:15px;font-weight:600;}

.form{padding:14px 18px;}

.ar{display:flex;align-items:center;gap:12px;padding:15px 0;}

.chip{background:var(--surf);border:1px solid var(--line);border-radius:100px;padding:9px 13px;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;line-height:1.2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;}

.bea i:nth-child(2){animation-delay:.66s}.bea i:nth-child(3){animation-delay:1.33s}

@keyframes p{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}
.wait h3{font-family:Golos Text,sans-serif;font-weight:600;font-size:16px;}
.wait p{font-size:12.5px;color:var(--dim);margin-top:5px;}
.price{font-family:'Roboto Mono',monospace;font-weight:700;font-size:17px;}
.pick{background:var(--g);color:#06120b;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;}
.empty{text-align:center;padding:44px 26px;color:var(--dim);font-size:13px;line-height:1.6;}
.empty b{display:block;font-family:Golos Text,sans-serif;font-size:16px;color:var(--ink);margin-bottom:6px;}
.ok{width:60px;height:60px;border-radius:20px;background:var(--g);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.conf{padding:24px 20px;text-align:center;}
.conf h3{font-family:Golos Text,sans-serif;font-weight:600;font-size:19px;}
.conf p{font-size:12.5px;color:var(--dim);margin-top:6px;}
.dbox{margin-top:18px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;}
.fl{padding:10px 18px;}
.fr{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:12px;}
.fr label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px;}
.fr input{width:100%;background:transparent;border:none;outline:none;color:var(--ink);font-size:15px;font-weight:500;font-family:Golos Text,sans-serif;}
.fr input::placeholder{color:var(--dim);font-weight:400;}
.sv{padding:6px 18px 24px;}
.obar{display:flex;align-items:center;justify-content:space-between;margin:14px;padding:14px;background:var(--surf);border:1px solid var(--line);border-radius:15px;}
.obar.off{border-color:rgba(226,88,90,.45);}
.obar .l{font-size:14px;font-weight:600;}
.obar.off .l{color:var(--red);}
.tg{width:46px;height:27px;border-radius:100px;background:var(--line2);position:relative;cursor:pointer;transition:.2s;flex-shrink:0;}
.tg.on{background:var(--g);}
.tg b{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;}
.tg.on b{left:22px;}
.req{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:15px;margin:0 14px 11px;box-shadow:var(--sh);animation:in .3s;}
.req.direct{border-color:var(--am);}

.ra{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}

.ra .skip{flex:1 1 0;min-width:0;background:transparent;color:var(--dim);border:1px solid var(--line2);border-radius:11px;padding:12px 10px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;}
.ra .skip.ask{color:var(--g);border-color:var(--gs);}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.3px;}
.badge.am{background:rgba(242,167,59,.2);color:var(--am);}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;}
.ast{background:var(--surf);border:1px solid var(--line);border-radius:15px;padding:15px;}
.ast .n{font-family:'Roboto Mono',monospace;font-weight:700;font-size:23px;}
.ast .n.g{color:var(--g)}.ast .n.a{color:var(--am)}
.ast .l{font-size:11.5px;color:var(--dim);margin-top:5px;}
.ai{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);}
.ai .ava{width:38px;height:38px;font-size:14px;border-radius:11px;}
.rolebtn{background:transparent;color:var(--dim);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
nav{display:flex;background:var(--elev);border-top:1px solid var(--line);padding:9px 8px calc(14px + env(safe-area-inset-bottom));flex-shrink:0;}

.pa{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;font-family:Golos Text,sans-serif;font-weight:700;font-size:27px;color:#06120b;overflow:hidden;position:relative;flex-shrink:0;}

.avcam{position:absolute;right:0;bottom:0;width:24px;height:24px;border-radius:50%;background:var(--surf);border:2px solid var(--elev);display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;}
.avdel{display:inline-block;margin:-6px 0 10px;font-size:11.5px;color:var(--dim);cursor:pointer;}
.pn{font-family:Golos Text,sans-serif;font-weight:600;font-size:19px;}
.pr{font-size:12.5px;color:var(--dim);margin-top:3px;}
.ml{padding:6px 18px 24px;}
.mi{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:500;cursor:pointer;}
.mi .c{color:var(--dim);}
.mask{position:fixed;inset:0;background:rgba(4,6,5,.7);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:430px;background:var(--surf);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));position:relative;}
/* крестик в углу: в длинных списках листать до кнопки внизу неудобно */
.shx{position:sticky;top:-20px;float:right;z-index:5;width:34px;height:34px;margin:-8px -4px 0 0;border-radius:50%;background:var(--line);border:none;color:var(--ink);font-size:19px;line-height:34px;text-align:center;cursor:pointer;padding:0;}

.abar{display:flex;align-items:center;gap:12px;background:var(--surf);border-top:1px solid var(--g);padding:11px 16px;cursor:pointer;flex-shrink:0;}

.dright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.planwhen{background:rgba(240,180,60,.1);border:1px solid rgba(240,180,60,.28);border-radius:11px;
 padding:11px 14px;font-size:14.5px;font-weight:600;color:var(--am);margin-bottom:12px;}
.abar.plan{border-left:3px solid var(--am);}
.plbadge{background:var(--red);color:#fff;border-radius:20px;font-size:10px;font-weight:700;padding:1px 7px;}
.plancard{display:block!important;background:var(--surf);border:1px solid var(--line2);
 border-left:3px solid var(--am);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.plancard.ok{border-left-color:var(--g);}
.plrow{display:flex;align-items:center;gap:12px;}
.plclock{font-size:19px;line-height:1;flex-shrink:0;}
.plmain{flex:1;min-width:0;}
.plwhen{font-size:14px;font-weight:600;margin-bottom:3px;}
.plroute{font-size:12.5px;color:var(--ink);line-height:1.4;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.plsub{font-size:11.5px;color:var(--dim);margin-top:3px;}
.plgo{color:var(--dim);font-size:19px;flex-shrink:0;}
.plbadge{background:var(--red);color:#fff;border-radius:20px;font-size:11px;font-weight:700;
 padding:2px 8px;flex-shrink:0;}
.schedhead{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--am);margin:4px 0 10px;display:flex;gap:8px;align-items:center;}

.req.sched{border-left:3px solid var(--am);}
.schedwhen{font-size:12.5px;font-weight:600;color:var(--am);margin-bottom:7px;}

.homecard{margin:0 14px 16px;background:linear-gradient(140deg,rgba(51,209,126,.09),rgba(51,209,126,.02));
 border:1px solid rgba(51,209,126,.22);border-radius:16px;padding:15px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;}
.hcico{font-size:26px;line-height:1;flex-shrink:0;}
.hctx{flex:1;min-width:150px;}
.hctx b{display:block;font-size:14.5px;margin-bottom:4px;}
.hctx span{display:block;font-size:12px;color:var(--dim);line-height:1.5;}
.hcact{display:flex;gap:8px;width:100%;}
.hcadd{flex:1;background:var(--g);color:#06120b;border:none;border-radius:11px;padding:11px;
 font-size:13.5px;font-weight:700;font-family:Golos Text,sans-serif;cursor:pointer;}

 font-family:Golos Text,sans-serif;cursor:pointer;}

.delivnote{margin:0 14px 12px;padding:10px 13px;background:rgba(91,157,249,.1);border:1px solid rgba(91,157,249,.25);border-radius:11px;font-size:12.5px;color:#8FBEFB;}
.cta2{width:100%;margin-top:9px;background:transparent;border:1px solid var(--line2);color:var(--ink);border-radius:14px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:Golos Text,sans-serif;}
.delivbox{display:flex;align-items:center;gap:12px;margin:0 18px 14px;padding:14px;background:var(--surf);border:1px solid var(--line);border-radius:14px;}
.dvt{flex:1;}
.dvt b{display:block;font-size:14px;}
.dvt span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4;}
.tgmini{width:30px;height:30px;border-radius:9px;background:#229ED9;display:flex;align-items:center;justify-content:center;font-size:14px;text-decoration:none;flex-shrink:0;}
.tgmini.off{background:var(--line2);opacity:.4;}
.rcom{background:var(--bg);border-left:2px solid var(--am);border-radius:0 9px 9px 0;padding:9px 11px;margin-top:9px;font-size:13px;line-height:1.45;color:var(--ink);}
.rprice{display:flex;align-items:center;gap:10px;margin-top:10px;padding:11px 13px;background:var(--gs);border:1px solid rgba(51,209,126,.28);border-radius:12px;}
.rpt{font-size:11px;color:var(--dim);}
.rpv{flex:1;font-family:'Roboto Mono',monospace;font-weight:700;font-size:19px;color:var(--g);}
.agree{background:var(--g);color:#06120b;border:none;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:Golos Text,sans-serif;flex-shrink:0;}
.commbox{background:var(--bg);border:1px solid var(--line2);border-radius:13px;padding:14px 16px;margin:0 0 12px;}
.commt{font-family:Golos Text,sans-serif;font-size:17px;font-weight:600;margin-bottom:9px;}
.commi{font-size:13px;line-height:1.5;padding-left:17px;position:relative;margin-bottom:5px;color:var(--ink);}
.commi::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--g);}
.commst{font-size:12.5px;color:var(--dim);}
.commst.on{color:var(--g);font-weight:600;}
.ra2{display:flex;gap:8px;margin-top:12px;}
.ra2 button{flex:1;padding:13px 10px;border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:Golos Text,sans-serif;border:1px solid var(--line2);background:transparent;color:var(--ink);}
.ra2 .acc{background:var(--g);border-color:var(--g);color:#06120b;}
.ra2 .skip{color:var(--dim);}
.appcontact{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;}
.acbtn{
 flex:1;min-width:96px;display:flex;align-items:center;justify-content:center;gap:5px;
 padding:10px 8px;border-radius:11px;font-size:12px;font-weight:600;
 text-decoration:none;border:1px solid var(--line2);color:var(--ink);
 background:var(--bg);font-family:Golos Text,sans-serif;cursor:pointer;box-sizing:border-box;
}
.acbtn.call{border-color:var(--g);color:var(--g);}
.acbtn.tg{background:#229ED9;border-color:#229ED9;color:#fff;}
.acbtn.wr{background:var(--g);border-color:var(--g);color:#06120b;}
.acbtn.dim{color:var(--dim);background:transparent;}
.drvbox{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line2);border-radius:13px;padding:13px;margin-bottom:10px;}
.drvst{flex:1;min-width:0;}
.drvst b{display:block;font-size:13.5px;}
.drvst span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;}
.drvbtn{border:none;border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:Golos Text,sans-serif;flex-shrink:0;}
.drvbtn.on{background:var(--g);color:#06120b;}
.drvbtn.off{background:transparent;border:1px solid var(--red);color:var(--red);}
.reqbox{background:var(--bg);border:1px solid var(--line2);border-radius:13px;padding:13px 15px;margin:12px 0;}
.reqt{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:9px;}
.reqi{font-size:13px;line-height:1.5;padding-left:18px;position:relative;margin-bottom:6px;}
.reqi:last-child{margin-bottom:0;}
.reqi::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--g);}
.refbox{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px;background:var(--bg);border:1px dashed var(--g);border-radius:12px;}
.refcode{flex:1;font-family:'Roboto Mono',monospace;font-size:22px;font-weight:700;letter-spacing:3px;color:var(--g);text-align:center;}
.reflink{flex:1;font-family:'Roboto Mono',monospace;font-size:12px;color:var(--g);word-break:break-all;line-height:1.5;}
.subcard{display:flex;align-items:center;gap:12px;margin:0 18px 14px;padding:14px;background:linear-gradient(135deg,rgba(51,209,126,.12),rgba(51,209,126,.03));border:1px solid var(--g);border-radius:14px;}
.subcard .sct{font-size:15px;}.subcard .scs{font-size:11.5px;color:var(--dim);margin-top:3px;}
.subbtn{background:var(--g);color:#06120b;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;}
.plan{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line2);border-radius:13px;margin-bottom:9px;cursor:pointer;transition:.15s;}
.plan.on{border-color:var(--g);background:rgba(51,209,126,.08);}
.plan .pd{flex:1;}.plan .pdt{font-size:15px;font-weight:600;}.plan .pds{font-size:11.5px;color:var(--dim);margin-top:2px;}
.plan .pp{font-size:17px;font-weight:700;font-family:'Roboto Mono',monospace;}
.plan .best{font-size:9px;background:var(--g);color:#06120b;padding:2px 6px;border-radius:5px;font-weight:700;margin-left:6px;vertical-align:middle;}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(16px);background:var(--g);color:#06120b;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.28s;z-index:90;pointer-events:none;max-width:88%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#boot{
 position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
 z-index:200;color:var(--dim);font-size:14px;padding:20px;text-align:center;
 transition:opacity .35s ease;
}
#boot.gone{opacity:0;pointer-events:none;}

.bsplash{display:flex;flex-direction:column;align-items:center;gap:0;}

/* шашечки — как на борту такси */
.bchk{
 width:132px;height:9px;margin-bottom:26px;border-radius:2px;
 background:
  repeating-linear-gradient(90deg,#f2f5f3 0 11px,transparent 11px 22px) 0 0/22px 4.5px repeat-x,
  repeating-linear-gradient(90deg,transparent 0 11px,#f2f5f3 11px 22px) 0 4.5px/22px 4.5px repeat-x;
 opacity:.9;
 animation:bchkin .5s ease both;
}
@keyframes bchkin{from{opacity:0;transform:translateY(-6px)}to{opacity:.9;transform:none}}

/* вывеска: по ней проходит свет фар */
.bmark{
 position:relative;font-family:Golos Text,sans-serif;font-weight:700;
 font-size:44px;line-height:1;letter-spacing:2.5px;color:#f2f5f3;
 animation:bmarkin .55s .1s ease both;
}
.bmark em{font-style:normal;color:var(--g);}
.bmark::after{
 content:"";position:absolute;inset:-6px -22px;pointer-events:none;
 background:linear-gradient(102deg,transparent 38%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.15) 56%,transparent 64%);
 transform:translateX(-115%);
 animation:bsweep 2.6s 1s ease-in-out infinite;
 mix-blend-mode:screen;
}
@keyframes bmarkin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bsweep{0%{transform:translateX(-115%)}55%,100%{transform:translateX(115%)}}

.btag{
 margin-top:12px;font-family:Golos Text,sans-serif;font-size:12.5px;letter-spacing:.4px;
 color:var(--dim);animation:bmarkin .55s .25s ease both;
}

/* дорожная разметка вместо крутилки */
.broad{
 position:relative;width:148px;height:2px;margin-top:34px;border-radius:2px;
 background:rgba(255,255,255,.07);overflow:hidden;
 animation:bmarkin .55s .4s ease both;
}
.broad i{
 position:absolute;inset:0;
 background:repeating-linear-gradient(90deg,var(--g) 0 16px,transparent 16px 34px);
 animation:broadrun 1.1s linear infinite;
}
@keyframes broadrun{from{transform:translateX(-34px)}to{transform:translateX(0)}}

@media (prefers-reduced-motion:reduce){
 .bmark::after{animation:none;opacity:0;}
 .broad i{animation:none;}
 .bchk,.bmark,.btag,.broad{animation-duration:.01ms;}
}

/* ================= НОВЫЙ ВИД ================= */
body{background:var(--bg);font-family:Golos Text,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.device{background:var(--bg);}
::selection{background:var(--g);color:#04140a;}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px;}
.body::-webkit-scrollbar{width:0;}
.checker{display:none;}

/* шапка */
.top{background:transparent;border:none;padding:16px 18px 4px;}
.brand{font-family:Golos Text,sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;}
.brand em{color:var(--g);font-style:normal;}
.citychip{background:transparent;border:none;color:var(--dim);font-size:13px;padding:0;}
.pill{background:transparent;border:none;padding:0;gap:7px;font-size:15px;font-weight:600;}
.dot{width:7px;height:7px;position:relative;}
.dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--g);opacity:.4;animation:bpl 3s ease-out infinite;}
@keyframes bpl{0%{transform:scale(.5);opacity:.6}70%,100%{transform:scale(1.4);opacity:0}}

/* переключатель ролей */
.rsw{background:var(--surf);border:none;border-radius:14px;padding:4px;gap:4px;margin:12px 18px 0;}
.rb{flex:1;border-radius:11px;border:none;background:transparent;padding:10px 0;
 font-family:Golos Text,sans-serif;font-size:14px;font-weight:500;color:var(--dim);}
.rb.on{background:var(--card2);color:var(--ink);}

/* город */
.cityhead{display:flex;align-items:flex-start;gap:11px;padding:14px 18px 0;}
.cityhead .cp{width:22px;height:22px;margin-top:7px;flex-shrink:0;}
.cityhead .cp svg{width:100%;height:100%;stroke:var(--ink);fill:none;stroke-width:1.8;}
.cityhead h1{font-family:Golos Text,sans-serif;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.05;}
.cityhead .cs{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13.5px;margin-top:6px;}
.cityhead .cchip{margin-left:auto;text-align:right;padding-top:5px;flex-shrink:0;}
.cityhead .cchip .n{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:16px;font-weight:600;}
.cityhead .cchip .l{font-size:11px;color:var(--dim2);margin-top:2px;}
.bpx{width:7px;height:7px;border-radius:50%;background:var(--g);flex-shrink:0;}

/* сводка строкой */
.sumline{display:flex;align-items:center;gap:9px;margin:20px 18px 0;color:var(--dim);font-size:13.5px;flex-wrap:wrap;}
.sumline b{color:var(--ink);font-weight:600;font-size:14.5px;}
.sumline s{width:3px;height:3px;border-radius:50%;background:var(--dim2);text-decoration:none;}

/* кнопки */
.hero{padding:0 18px;}
.cta{width:100%;margin-top:14px;height:62px;border:none;border-radius:17px;box-shadow:none;
 background:var(--g);color:#04140a;
 font-family:Golos Text,sans-serif;font-size:15.5px;font-weight:700;letter-spacing:0;text-transform:none;
 display:flex;align-items:center;justify-content:space-between;padding:0 22px;
 transition:transform .15s cubic-bezier(.2,.8,.2,1);}
.cta svg{width:19px;height:19px;stroke:#04140a;fill:none;stroke-width:2.2;flex-shrink:0;}
.cta:active{transform:scale(.985);}
.cta2{width:100%;margin-top:10px;background:var(--surf);border:none;border-radius:15px;padding:15px 17px;
 display:flex;align-items:center;gap:13px;font-family:Golos Text,sans-serif;font-size:14.5px;
 font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;cursor:pointer;}
.cta2 .dic{width:21px;height:21px;flex-shrink:0;}
.cta2 .dic svg{width:100%;height:100%;stroke:var(--ink);fill:none;stroke-width:1.7;}
.cta2 .dt2{flex:1;text-align:left;}
.btn{border-radius:16px;height:56px;background:linear-gradient(180deg,var(--g),var(--g2));color:#04140a;
 font-family:Golos Text,sans-serif;font-weight:700;font-size:15.5px;text-transform:none;letter-spacing:0;box-shadow:none;}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--ink);font-weight:500;}
.btn.dang{background:none;border:1px solid rgba(226,88,90,.3);color:var(--red);font-weight:500;}
.pick{background:var(--g);color:#04140a;border-radius:13px;font-weight:700;}

/* заголовок раздела */
.head{padding:26px 18px 10px;}
.head h2{font-family:Golos Text,sans-serif;font-weight:600;font-size:14.5px;letter-spacing:0;text-transform:none;color:var(--ink);}
.head .m{font-family:Golos Text,sans-serif;font-size:12px;color:var(--dim2);}

/* карточка водителя */
.list{padding:0 18px 24px;}
.dcard{background:var(--surf);border:none;border-radius:17px;padding:15px;display:flex;align-items:center;gap:13px;margin-bottom:9px;box-shadow:none;}
.dcard .ava{width:52px;height:52px;border-radius:50%;background:#1e2a24;color:var(--g);
 font-family:Golos Text,sans-serif;font-weight:600;font-size:20px;flex-shrink:0;position:relative;overflow:visible;}
.dcard .ava img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.dcard .ava .onx{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px var(--surf);}
.dcard .nmx{font-family:Golos Text,sans-serif;font-size:16.5px;font-weight:600;letter-spacing:-.01em;}
.dcard .row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);margin-top:3px;}
.dcard .row svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0;}
.dcard .row.dl{color:var(--blue);}
.dcard .row em{color:var(--g);font-style:normal;}
.dcard .row .car,.dcard .row .loc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dcard .dright{flex-direction:column;align-items:flex-end;gap:11px;flex-shrink:0;}
.rmini{display:flex;align-items:center;gap:5px;font-family:Golos Text,sans-serif;font-size:15.5px;font-weight:600;color:var(--ink);}
.rmini svg{width:14px;height:14px;fill:var(--gold);}
.fav{font-size:19px;color:var(--line2);background:none;border:none;padding:0;}
.fav.on{color:var(--g);}
.plate{border-radius:8px;font-size:10.5px;padding:2px 7px;}

/* факты */
.facts{display:flex;background:var(--surf);border-radius:17px;margin:18px 18px 0;}
.facts .f{flex:1;padding:15px 8px;text-align:center;}
.facts .f+.f{border-left:1px solid var(--line);}
.facts .v{font-family:Golos Text,sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em;}
.facts .v small{font-size:11.5px;font-weight:500;color:var(--dim);margin-left:2px;}
.facts .l{font-size:11px;color:var(--dim2);margin-top:3px;}

/* остальные карточки */
.card{background:var(--surf);border:none;border-radius:17px;box-shadow:none;padding:15px;margin-bottom:9px;}
.req{background:var(--surf);border:none;border-radius:17px;box-shadow:none;margin:0 18px 10px;padding:16px;}
.req.direct{box-shadow:0 0 0 1px var(--gs);}
.ra .acc{background:var(--g);color:#04140a;border-radius:14px;font-weight:700;font-size:14.5px;padding:14px;}
.ra .skip{border:1px solid var(--line2);border-radius:14px;font-weight:500;padding:14px 18px;}

/* поля */
.form{padding:0 18px;}
.addr{background:var(--surf);border:none;border-radius:17px;box-shadow:none;padding:4px 16px;}
.ar{padding:16px 0;}
.ar+.ar{border-top:1px solid var(--line);}
.pin{width:9px;height:9px;box-shadow:none;}
.pin.to{background:var(--am);border-radius:2px;box-shadow:none;}
.fr{background:var(--surf);border:none;border-radius:15px;padding:14px 16px;box-shadow:none;}
.fr label{font-size:12.5px;color:var(--dim2);text-transform:none;letter-spacing:0;}
.chip{background:var(--surf);border:none;border-radius:12px;font-weight:500;}
.chip.on{background:var(--g);color:#04140a;}

/* меню профиля */
.ph{background:transparent;border:none;padding:20px 18px 18px;}
.pa{border-radius:50%;background:#1e2a24;color:var(--g);font-family:Golos Text,sans-serif;font-weight:600;}
.pn{font-family:Golos Text,sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em;}
.pr{font-size:13.5px;color:var(--dim);}
.mi{background:var(--surf);border:none;border-radius:0;padding:16px;font-size:14.5px;font-weight:400;}
.mi:first-child{border-radius:17px 17px 0 0;}
.mi:last-child{border-radius:0 0 17px 17px;}
.mi+.mi{border-top:1px solid var(--line);}
.mi .c{color:var(--dim2);font-size:13px;}

/* статистика панели */
.ast{background:var(--surf);border:none;border-radius:16px;box-shadow:none;padding:15px;}
.ast .n{font-family:Golos Text,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.03em;}
.ast .l{font-size:12px;color:var(--dim2);margin-top:3px;}
.agrid{padding:16px 18px;gap:9px;}
.ai{background:var(--surf);border:none;border-radius:15px;padding:13px 15px;margin-bottom:8px;}
.hgrid{gap:9px;}
.hs{background:var(--surf);border:none;border-radius:16px;box-shadow:none;padding:15px;}
.hs .n{font-family:Golos Text,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.03em;}
.hs .l{font-size:12px;color:var(--dim2);margin-top:3px;}

/* тумблер смены */
.obar{background:var(--surf);border:none;border-radius:19px;margin:16px 18px 0;padding:19px;}
.tg{background:#2a312d;}
.tg.on{background:var(--g);}

/* навигация */
nav{background:transparent;border-top:1px solid var(--line);padding:9px 6px calc(11px + env(safe-area-inset-bottom));}
.nb{font-family:Golos Text,sans-serif;font-size:10.5px;font-weight:400;gap:5px;color:var(--dim2);position:relative;}
.nb svg{width:22px;height:22px;stroke-width:1.8;}
.nb.active{color:var(--g);}
.nb.active::after{content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
 width:24px;height:2.5px;border-radius:2px;background:var(--g);}

/* шторки и мелочи */
.mask{background:rgba(4,7,5,.75);backdrop-filter:blur(3px);}
.sheet{background:var(--card2);border-radius:22px 22px 0 0;}
.sheet h3{font-family:Golos Text,sans-serif;font-weight:700;letter-spacing:-.02em;}
.sa .o{background:var(--g);color:#04140a;border-radius:14px;font-weight:700;}
.sa .c{border:1px solid var(--line2);border-radius:14px;}
.empty b{font-family:Golos Text,sans-serif;font-weight:600;font-size:16px;}
.badge{font-weight:600;letter-spacing:0;text-transform:none;font-size:11px;border-radius:8px;}
.abar{background:var(--card2);border-top:1px solid var(--line);}
.stars span.on{color:var(--gold);}
.plancard{background:var(--surf);border:none;border-radius:17px;box-shadow:none;}


/* блок смены: строки не должны слипаться */
.shift{background:var(--surf);border:1px solid rgba(47,208,111,.25);border-radius:17px;margin:0 18px 10px;padding:16px;
 display:flex;align-items:center;gap:14px;}
.shift .t{flex:1;min-width:0;}
.shift .t b{display:block;font-family:Golos Text,sans-serif;font-size:16px;font-weight:600;}
.shift .t span{display:block;font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.5;}
.shift .t span#sleft{color:var(--am);margin-top:2px;}
.shift .clk{font-family:Golos Text,sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--g);flex-shrink:0;}
.btn.ghost{height:48px;border-radius:14px;}


/* поля ввода: текст должен быть хорошо виден */
input,textarea,select{
  color:var(--ink)!important;
  font-family:Golos Text,system-ui,sans-serif;
  font-size:16px;
  caret-color:var(--g);
  background:transparent;
}
input::placeholder,textarea::placeholder{color:var(--dim2);opacity:1;}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 60px var(--surf) inset;}
.gate input,.fr input,.fr textarea{
  color:var(--ink)!important;font-size:16px;font-weight:500;
}
.gate input{
  width:100%;background:var(--surf);border:1px solid rgba(47,208,111,.45);
  border-radius:15px;padding:16px;margin-top:6px;
}
.gate input:focus{border-color:var(--g);outline:none;}


/* иконки внутри текста */
.ii{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
 vertical-align:-2px;margin-right:6px;display:inline-block;}
.mi2 svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;display:block;}
.motonote{display:flex;align-items:center;gap:0;}

/* тумблеры режимов */
.modes{gap:9px;padding:0 18px;}
.mode{background:var(--surf);border:1px solid transparent;border-radius:15px;padding:14px 12px;
 font-family:Golos Text,sans-serif;font-size:14px;font-weight:500;color:var(--dim);
 display:flex;align-items:center;gap:9px;}
.mode.on{border-color:rgba(47,208,111,.4);color:var(--ink);background:var(--card2);}
.mode i{margin-left:auto;font-style:normal;font-size:12px;color:var(--dim2);}
.mode.on i{color:var(--g);}

/* компактная кнопка продления */
.extbtn{height:46px;margin-top:0;font-size:14px;font-weight:500;
 border-radius:14px;letter-spacing:0;text-transform:none;}

/* строка «где стою» */
.card .nm{display:flex;align-items:center;font-size:15.5px;font-weight:600;}
.card .sub{font-size:12.5px;color:var(--dim);margin-top:3px;}
.card .go{color:var(--g);font-size:13px;font-weight:500;}

/* полоса «вы на линии» */
.obar{display:flex;align-items:center;justify-content:space-between;}
.obar .l{font-family:Golos Text,sans-serif;font-size:17px;font-weight:600;}


/* ровные отступы блоков кабинета водителя */
.obar{margin:14px 18px 10px;}
.modes{margin-bottom:10px;}
.shift{margin:0 18px 10px;}
.motonote{margin:0 18px 10px;border-radius:15px;padding:14px 16px;}
.ii{flex-shrink:0;}
.avcam{display:flex;align-items:center;justify-content:center;}


/* значки в строках карточки — ровный размер и отступ */
.emj{font-size:13px;line-height:1;width:16px;display:inline-flex;justify-content:center;flex-shrink:0;
 filter:saturate(.85);}
.cityhead{padding-left:18px;}


/* ================= ПАЛИТРЫ ================= */
body[data-t="orange"]{
  --bg:#0c0a08;--elev:#0c0a08;--surf:#171310;--card2:#1d1814;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#fff;--dim:#978c81;--dim2:#6a6058;
  --g:#e07a2b;--g2:#c56520;--gs:rgba(224,122,43,.12);
  --am:#e0a94a;--gold:#e0a94a;--blue:#6a9fd8;--onac:#1a0d02;
}
body[data-t="light"]{
  --bg:#f1f3f0;--elev:#f1f3f0;--surf:#fbfcfa;--card2:#e9ece7;
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.15);
  --ink:#0e1411;--dim:#6b7570;--dim2:#98a09b;
  --g:#1a9b53;--g2:#158445;--gs:rgba(26,155,83,.11);
  --am:#c98510;--gold:#d9a017;--blue:#2f7fd4;--onac:#fff;
}
body[data-t="mono"]{
  --bg:#0a0a0b;--elev:#0a0a0b;--surf:#141416;--card2:#1a1a1d;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --ink:#fff;--dim:#8e8e93;--dim2:#5f5f65;
  --g:#dcdce0;--g2:#c4c4c9;--gs:rgba(255,255,255,.08);
  --am:#e8b84b;--gold:#e8b84b;--blue:#7aa7d8;--onac:#0a0a0b;
}
body[data-t="blue"]{
  --bg:#070b12;--elev:#070b12;--surf:#0f1521;--card2:#141c2b;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --ink:#fff;--dim:#8b96ab;--dim2:#5d6779;
  --g:#4a85d6;--g2:#3a6fb8;--gs:rgba(74,133,214,.12);
  --am:#d99a3f;--gold:#dfae4a;--blue:#4a85d6;--onac:#02101f;
}
/* цвет «текста на зелёном» — только для сплошных кнопок.
   у прозрачных фон обычный, там текст должен быть как везде */
.cta:not(.ghost),.btn:not(.ghost):not(.dang),.ra .acc,.pick,.sa .o{color:var(--onac,#04140a)!important;}
.cta:not(.ghost) svg{stroke:var(--onac,#04140a);}
.avcam svg{stroke:var(--onac,#04140a)!important;}

/* прозрачные и опасные кнопки */
.btn.ghost,.cta.ghost{color:var(--ink)!important;background:transparent!important;
 border:1px solid var(--line2)!important;}
.btn.ghost svg,.cta.ghost svg{stroke:var(--ink)!important;}
.btn.dang{color:var(--red)!important;background:transparent!important;
 border:1px solid rgba(226,88,90,.35)!important;}
.cta2{color:var(--ink)!important;}
.cta2 .dic svg{stroke:var(--ink)!important;}
.sa .c{color:var(--ink)!important;background:transparent!important;
 border:1px solid var(--line2)!important;}
.txtbtn,.second{color:var(--dim)!important;}

/* галочка «водитель выехал» — контраст на любом фоне */
.conf .ok{background:var(--g)!important;}
.conf .ok svg{stroke:var(--onac,#06120b)!important;}

/* значок непрочитанного на кнопке */
.mbadge{background:var(--onac,#04140a);color:var(--g);}

/* светлая тема: аватар и мелочи не должны сливаться */
body[data-t="light"] .dbox .ava{background:var(--g);color:#fff;}
body[data-t="light"] .fav{color:#c9cec7;}
body[data-t="light"] .fav.on{color:var(--g);}
body[data-t="light"] .plate{border-color:var(--line2);}
body[data-t="mono"] .dbox .ava{background:var(--g);color:var(--onac);}
body[data-t="light"] .device{background:var(--bg);}
body[data-t="light"] .mask{background:rgba(20,24,22,.4);}
body[data-t="light"] .pa,body[data-t="light"] .dcard .ava{background:#e7ebe6;}
.themes{display:flex;flex-direction:column;gap:8px;padding:14px 0 4px;}
.thopt{width:100%;border:1px solid var(--line2);border-radius:14px;padding:14px 15px;
 background:var(--surf);cursor:pointer;font-family:Golos Text,sans-serif;font-size:14.5px;
 color:var(--dim);display:flex;align-items:center;gap:12px;text-align:left;
 white-space:nowrap;}
.thopt::after{content:'';margin-left:auto;width:18px;height:18px;border-radius:50%;
 border:1.5px solid var(--line2);flex-shrink:0;}
.thopt.on{border-color:var(--g);color:var(--ink);background:var(--card2);}
.thopt.on::after{border-color:var(--g);background:var(--g);
 box-shadow:inset 0 0 0 3.5px var(--surf);}
.thopt .sw{box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);}
.thopt.on{border-color:var(--g);color:var(--ink);background:var(--card2);}
.thopt .sw{width:22px;height:22px;border-radius:7px;flex-shrink:0;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
.thhint{padding:8px 0 0;font-size:12px;color:var(--dim2);line-height:1.5;}


/* значок с числом на кнопке панели */
.nb{position:relative;}
.nbadge{position:absolute;top:0;right:50%;transform:translateX(18px);
 min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);
 color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center;}

/* ===== v156: точечные улучшения текущего вида ===== */
/* главная: город и счётчики без повторов */
.device:has(#main .cityhead) .top .citychip{display:none!important;}
.device:has(#main .cityhead) .top .pill{visibility:hidden;}
.cityh{display:inline-flex;align-items:center;gap:4px;cursor:pointer;}
.cityh svg{width:22px;height:22px;stroke:var(--dim);fill:none;stroke-width:2.2;margin-top:5px;flex-shrink:0;}
.sumline.sl2{margin:9px 0 0;font-size:13px;gap:7px;}
.sumline.sl2 b{font-size:13.5px;}
/* главная кнопка «Вызвать машину» */
.cta.cta3{height:auto;min-height:70px;padding:12px 20px 12px 22px;justify-content:flex-start;gap:13px;text-align:left;}
.cta3 .cic{width:48px;height:48px;border-radius:15px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:31px;line-height:1;}
.cta3 .ctt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.cta3 .ctt b{font-size:17px;font-weight:700;letter-spacing:-.01em;}
.cta3 .ctt small{font-size:12.5px;font-weight:500;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* три быстрые плитки */
.qtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;}
.qt{background:var(--surf);border:none;border-radius:15px;padding:13px 11px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
 cursor:pointer;font-family:Golos Text,sans-serif;text-align:left;color:var(--ink);min-width:0;transition:transform .15s;}
.qt svg{width:22px;height:22px;stroke:var(--g);fill:none;stroke-width:1.8;margin-bottom:7px;flex-shrink:0;}
.qt b{font-size:14px;font-weight:600;}
.qt span{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.qt #delcnt{color:var(--g);}
.qt:active{transform:scale(.97);}

/* нижнее меню: выбранная вкладка — на подложке */
.nb svg{box-sizing:content-box;padding:4px 16px;border-radius:15px;transition:background .2s;}
.nb.active svg{background:var(--gs);}
.nb.active{font-weight:600;}
.nb.active::after{display:none;}
nav{padding-top:7px;}

/* форма заказа */
.fhead{padding:20px 18px 14px;}
.fhead h2{font-size:23px;font-weight:700;letter-spacing:-.02em;}
.fhead .fsub{font-size:13px;color:var(--dim);margin-top:4px;}
.chip .chpin{width:14px;height:14px;stroke:var(--g);fill:none;stroke-width:2;flex-shrink:0;}
.chips .chip:not(.add){padding:9px 11px;gap:6px;}
.chip .x{font-size:10.5px;color:var(--dim2);padding:4px 0 4px 3px;}
/* переключатели — одна дорожка с выделенным пунктом */
.tabsw{background:var(--bg);border-radius:13px;padding:4px;gap:4px;}
.tabsw div{border:none;border-radius:10px;padding:11px 8px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s;}
.tabsw div.on{background:var(--g);color:var(--onac,#04140a);}
.tabsw div svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
/* «Ваша цена» с кнопками − / + */
.pricebox .prtop{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.pricebox .prtop label{margin:0;}
.prclr{background:none;border:none;padding:2px 0;color:var(--dim);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:Golos Text,sans-serif;}
.prrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
.prb{width:50px;height:50px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink);padding:0;}
.prb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}
.prb:active{transform:scale(.93);}
.prv{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:6px;}
.fr .prv input{width:100%;max-width:150px;text-align:center;font-family:'Roboto Mono',monospace;font-size:36px;font-weight:700;letter-spacing:-1px;padding:0;}
.fr .prv input::placeholder{font-family:Golos Text,sans-serif;font-size:19px;font-weight:500;letter-spacing:0;color:var(--dim);}
.prv span{font-family:'Roboto Mono',monospace;font-size:24px;color:var(--dim);font-weight:700;}
.pricebox.set .prv input{max-width:none;min-width:2.7ch;}
.pricebox.set .prv{gap:4px;}
.pricebox:not(.set) .prv span,.pricebox:not(.set) .prq,.pricebox:not(.set) .prclr{display:none;}
.prfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;min-height:32px;}
#phint{font-size:12.5px;color:var(--dim);line-height:1.4;}
#phint b{color:var(--ink);font-family:'Roboto Mono',monospace;font-weight:600;white-space:nowrap;}
.prq{display:flex;gap:6px;flex-shrink:0;}
.prq button{min-height:32px;padding:0 12px;border-radius:999px;background:var(--card2);border:none;color:var(--ink);font-family:'Roboto Mono',monospace;font-size:13px;font-weight:600;cursor:pointer;}
.btn.ghost.lite{border-color:transparent!important;color:var(--dim)!important;height:44px;margin-top:4px;}

/* водитель: заявки во всю ширину, цена не переносится */
#il .req{margin-left:0;margin-right:0;}
.rprice{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:center;}
.rprice .rpt{grid-column:1;grid-row:1;}
.rprice .rpv{grid-column:1;grid-row:2;white-space:nowrap;}
.rprice .agree{grid-column:2;grid-row:1 / 3;padding:12px 18px;font-size:14px;}
.rprice{border-color:transparent;}
.req .rp{flex-wrap:nowrap;}
.req .rp input{width:116px;flex-shrink:0;}
.req .rp input::placeholder{font-family:Golos Text,sans-serif;font-weight:500;font-size:14px;color:var(--dim2);}
.req .rp .rpl{color:var(--dim);font-size:15px;flex:1;min-width:0;}
.rpq{display:flex;gap:6px;flex-shrink:0;}
.rpq button{min-height:40px;padding:0 12px;border-radius:11px;background:var(--card2);border:1px solid var(--line2);color:var(--ink);font-family:'Roboto Mono',monospace;font-size:13.5px;font-weight:600;cursor:pointer;}
.rpq button:active{transform:scale(.95);}
.ra .skip.ask svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;vertical-align:-3px;margin-right:6px;}


/* ===== v159: статистика и обзор панели ===== */
.st-h{padding:20px 18px 12px;}
.st-h h2{font-size:23px;font-weight:700;letter-spacing:-.02em;}
.st-sub{font-size:13px;color:var(--dim);margin-top:4px;}
.st-load{text-align:center;color:var(--dim);font-size:13px;padding:40px 0;}
.st-back{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--g);font-family:Golos Text,sans-serif;font-size:13.5px;font-weight:600;padding:2px 14px 10px;cursor:pointer;}
.st-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;}
/* период — одна дорожка */
.st-per{display:flex;gap:4px;background:var(--surf);border-radius:14px;padding:4px;margin:0 18px 10px;}
.st-per div{flex:1;text-align:center;padding:10px 4px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--dim);cursor:pointer;transition:background .15s,color .15s;}
.st-per div.on{background:var(--g);color:var(--onac,#04140a);}
.st-cities{display:flex;gap:8px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none;}
.st-cities::-webkit-scrollbar{display:none;}
.st-cities div{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--surf);border:1px solid transparent;font-size:13px;font-weight:500;color:var(--dim);cursor:pointer;white-space:nowrap;}
.st-cities div.on{border-color:var(--g);color:var(--ink);background:var(--gs);}
.st-cmpnote{font-size:11.5px;color:var(--dim2);padding:0 18px 12px;line-height:1.4;}
/* главные цифры */
.st-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 18px 10px;}
.st-kpis.in{padding:0;}
.st-kpi{background:var(--surf);border-radius:17px;padding:14px 14px 12px;min-width:0;display:flex;flex-direction:column;}
.st-card .st-kpi{background:var(--card2);}
.st-kpi .k{font-size:12.5px;color:var(--dim);font-weight:500;line-height:1.3;}
.st-kpi .v{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-kpi .v small{font-size:16px;font-weight:600;color:var(--dim);letter-spacing:0;}
.st-kpi .x{font-size:11.5px;color:var(--dim2);margin-top:3px;line-height:1.35;}
.st-kpi .dl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:9px;}
.st-d{font-family:'Roboto Mono',monospace;font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:7px;white-space:nowrap;}
.st-d.up{color:var(--g);background:var(--gs);}
.st-d.dn{color:var(--red);background:rgba(226,88,90,.12);}
.st-d.fl{color:var(--dim);background:var(--line);font-family:Golos Text,sans-serif;font-weight:500;}
.st-was{font-size:11.5px;color:var(--dim2);white-space:nowrap;}
/* карточки разделов */
.st-card{background:var(--surf);border-radius:18px;padding:16px;margin:0 18px 12px;}
.st-ct{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px;}
.st-ct h3{font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;}
.st-ct span{font-size:12px;color:var(--dim2);white-space:nowrap;}
.st-stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:12px 0 10px;}
.st-stack i{display:block;height:100%;}
.st-say{font-size:13px;line-height:1.5;color:var(--dim);margin-bottom:6px;}
.st-say b{color:var(--ink);}
.st-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;}
.st-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.st-row .t{flex:1;min-width:0;}
.st-row .t b{display:block;font-size:14px;font-weight:600;}
.st-row .t span{display:block;font-size:12px;color:var(--dim2);margin-top:2px;line-height:1.35;}
.st-row .n{text-align:right;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;flex-shrink:0;}
.st-row .n span{display:block;font-size:11px;color:var(--dim2);font-weight:500;margin-top:1px;}
.st-row .chev,.st-drv .chev{width:16px;height:16px;stroke:var(--dim2);fill:none;stroke-width:2;flex-shrink:0;}
.st-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.st-btns button{flex:1 1 auto;min-height:42px;border-radius:12px;background:var(--card2);border:none;color:var(--ink);font-family:Golos Text,sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;padding:0 12px;}
.st-btns button.bad{color:var(--red);}
.st-btns button:active{transform:scale(.98);}
/* график */
.st-mini{display:flex;gap:3px;background:var(--bg);border-radius:11px;padding:3px;margin:8px 0 14px;}
.st-mini div{flex:1;text-align:center;padding:7px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--dim);cursor:pointer;}
.st-mini div.on{background:var(--card2);color:var(--ink);}
.st-bars{display:flex;align-items:flex-end;gap:3px;height:132px;margin-top:10px;}
.st-bars.h{gap:2px;}
.st-bars .c{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;}
.st-bars .c i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:rgba(139,148,143,.38);position:relative;overflow:hidden;}
.st-bars .c i u{position:absolute;left:0;right:0;bottom:0;background:var(--g);}
.st-bars.h .c i{background:var(--g);opacity:.5;}
.st-bars.h .c.pk i{opacity:1;}
.st-bars .c.sel i{box-shadow:0 0 0 2px var(--ink);}
.st-bars .c em{font-style:normal;font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim);text-align:center;margin-bottom:3px;}
.st-ax{display:flex;gap:3px;margin-top:6px;}
.st-bars.h+.st-ax{gap:2px;}
.st-ax span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--dim2);font-family:'Roboto Mono',monospace;line-height:1.25;white-space:nowrap;overflow:visible;}
.st-ax span.we{color:var(--am);}
.st-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:10px;}
.st-legend span{display:inline-flex;align-items:center;gap:6px;}
.st-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.st-legend i.a{background:var(--g);}
.st-legend i.b{background:rgba(139,148,143,.38);}
.st-legend .we{color:var(--am);}
.st-tip{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:12.5px;line-height:1.5;color:var(--dim);}
.st-tip b{color:var(--ink);font-weight:600;}
/* водители */
.st-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;}
.st-chips span{font-size:12px;color:var(--dim);background:var(--card2);border-radius:999px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;}
.st-chips i.g{width:7px;height:7px;border-radius:50%;background:var(--g);display:inline-block;}
.st-drv{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;}
.st-drv:first-of-type{border-top:none;}
.st-drv .rk{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--dim2);width:14px;flex-shrink:0;text-align:center;}
.st-drv .t{flex:1;min-width:0;}
.st-drv .t b{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
.st-drv .t b i.on{width:7px;height:7px;border-radius:50%;background:var(--g);display:inline-block;}
.st-drv .t span{display:block;font-size:12px;color:var(--dim2);margin-top:2px;line-height:1.35;}
.st-drv .bar{height:5px;border-radius:99px;background:var(--line);margin-top:7px;overflow:hidden;}
.st-drv .bar i{display:block;height:100%;border-radius:99px;background:var(--g);}
.st-drv .m{font-family:'Roboto Mono',monospace;font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.st-warn{margin-top:10px;padding:11px 13px;border-radius:13px;background:rgba(237,161,58,.08);border:1px solid rgba(237,161,58,.3);cursor:pointer;}
.st-warn.bad{background:rgba(226,88,90,.08);border-color:rgba(226,88,90,.32);}
.st-warn b{display:block;font-size:13px;font-weight:600;color:var(--ink);line-height:1.35;}
.st-warn span{display:block;font-size:12px;color:var(--dim);margin-top:3px;line-height:1.4;}
.st-empty{font-size:13px;color:var(--dim2);padding:12px 0 4px;}
/* качество */
.st-q{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);}
.st-ct+.st-q{border-top:none;padding-top:8px;}
.st-q svg{width:22px;height:22px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px;}
.st-q.am svg{stroke:var(--am);}
.st-q b{display:block;font-size:14px;font-weight:600;line-height:1.35;}
.st-q span{display:block;font-size:12px;color:var(--dim2);margin-top:2px;line-height:1.35;}
/* виды заказов, города */
.st-kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;}
.st-kinds div{background:var(--card2);border-radius:13px;padding:12px 11px;min-width:0;}
.st-kinds b{display:block;font-family:'Roboto Mono',monospace;font-size:20px;font-weight:700;}
.st-kinds span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.3;}
.st-kinds i{display:block;font-style:normal;font-family:'Roboto Mono',monospace;font-size:11px;color:var(--dim2);margin-top:4px;}
.st-sub2{font-size:12.5px;font-weight:600;color:var(--dim);margin:16px 0 2px;}
.st-city{padding:9px 0;cursor:pointer;}
.st-city .cn{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.st-city .cn b{font-size:13.5px;font-weight:600;}
.st-city .cn span{font-size:11.5px;color:var(--dim2);text-align:right;}
.st-city .ct{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden;}
.st-city .ct i{display:block;height:100%;border-radius:99px;background:var(--g);}
/* путь людей */
.st-fn{display:flex;align-items:center;gap:10px;padding:7px 0;}
.st-ct+.st-fn{margin-top:6px;}
.st-fn .l{width:42%;font-size:13px;line-height:1.3;}
.st-fn .b{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;}
.st-fn .b i{display:block;height:100%;border-radius:99px;background:var(--g);}
.st-fn .v{width:62px;text-align:right;font-family:'Roboto Mono',monospace;font-size:13px;font-weight:700;flex-shrink:0;}
.st-fn .v span{display:block;font-size:10.5px;color:var(--dim2);font-weight:500;}
/* обзор */
.st-ct h3 i.stlive{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block;margin-right:8px;animation:pls 2s infinite;}
.st-now3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;}
.st-now3 div{background:var(--card2);border-radius:14px;padding:12px 6px;text-align:center;}
.st-now3 b{display:block;font-family:'Roboto Mono',monospace;font-size:28px;font-weight:700;line-height:1.1;}
.st-now3 b.g{color:var(--g);}.st-now3 b.r{color:var(--red);}.st-now3 b.b{color:var(--blue);}
.st-now3 span{display:block;font-size:12px;color:var(--dim);margin-top:4px;}
.st-ok{display:flex;align-items:center;gap:12px;padding:8px 0 2px;}
.st-ok svg{width:22px;height:22px;stroke:var(--g);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;background:var(--gs);border-radius:50%;padding:7px;box-sizing:content-box;flex-shrink:0;}
.st-ok b{display:block;font-size:14px;font-weight:600;}
.st-ok span{display:block;font-size:12px;color:var(--dim2);margin-top:2px;}
.st-rv{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
.st-ct+.st-rv{border-top:none;padding-top:8px;}
.st-rv .ava{width:38px;height:38px;border-radius:50%;background:var(--card2);color:var(--g);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.st-rv .t{flex:1;min-width:0;}
.st-rv .t b{font-size:13.5px;font-weight:600;}
.st-rv .t b span{font-weight:400;color:var(--dim2);}
.st-rv .stars{color:var(--gold);font-size:13px;letter-spacing:1px;margin-top:2px;}
.st-rv .stars s{color:var(--line2);text-decoration:none;}
.st-rv p{font-size:12.5px;color:var(--dim);margin:4px 0 0;line-height:1.4;}
.st-rv .tm{font-size:11px;color:var(--dim2);flex-shrink:0;}
/* свой период */
.st-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px;}
.st-dates label span{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;}
.st-dates input{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line2);border-radius:11px;padding:11px 10px;color:var(--ink);font-size:15px;outline:none;}
/* список заявок */
.st-ride{padding:12px 0;border-top:1px solid var(--line);}
.sheet .s+.st-ride{border-top:none;}
.st-ride .r1{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.st-fate{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}
.st-fate i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.st-ride .tm{font-size:12px;color:var(--dim2);}
.st-ride .r2{font-size:14px;font-weight:600;margin:6px 0 5px;line-height:1.35;}
.st-ride .r2 em{font-style:normal;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--dim);margin-right:3px;}
.st-ride .r3{font-size:13px;line-height:1.6;}
.st-ride .r3>span{display:inline-block;width:64px;color:var(--dim2);}
.st-ride .r3 a{color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
.st-ride .r3 i{color:var(--dim2);}
.st-ride .r4{font-size:12.5px;color:var(--dim);margin:6px 0 8px;line-height:1.45;}
.st-ride .r4 b{color:var(--ink);font-family:'Roboto Mono',monospace;}

/* ===== v160: меню «Ещё» и «Обращения» ===== */
.st-cnt{font-style:normal;font-family:'Roboto Mono',monospace;font-size:11px;font-weight:700;background:var(--red);color:#fff;border-radius:99px;padding:1px 6px;margin-left:4px;vertical-align:1px;}
.mo-g{font-size:12.5px;font-weight:600;color:var(--dim);padding:6px 22px 8px;}
.mo-card{background:var(--surf);border-radius:18px;margin:0 18px 14px;overflow:hidden;}
.mo-i{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;}
.mo-i+.mo-i{border-top:1px solid var(--line);}
.mo-i:active{background:var(--card2);}
.mo-ic{width:36px;height:36px;border-radius:11px;background:var(--gs);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mo-ic svg{width:19px;height:19px;stroke:var(--g);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.mo-i .t{flex:1;min-width:0;}
.mo-i .t b{display:block;font-size:14.5px;font-weight:600;}
.mo-i .t span{display:block;font-size:12px;color:var(--dim2);margin-top:2px;line-height:1.35;}
.mo-i .chev{width:16px;height:16px;stroke:var(--dim2);fill:none;stroke-width:2;flex-shrink:0;}
#inboxc .head{display:none;}

/* ===== v160: заработок водителя ===== */
.st-per.e5 div{font-size:12.5px;padding:10px 2px;}
.st-bars.e .c i{background:var(--g);}
.e-trip{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
.st-ct+.e-trip{border-top:none;padding-top:8px;}
.e-trip .t{flex:1;min-width:0;}
.e-trip .t b{display:block;font-size:14px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.e-trip .t span{display:block;font-size:12px;color:var(--dim2);margin-top:2px;}
.e-trip .p{font-family:'Roboto Mono',monospace;font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0;}

/* ===== v161: группы и бот ===== */
.st-ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
.st-sub2+.st-ev{border-top:none;}
.st-ev>i{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.st-ev .t{flex:1;min-width:0;}
.st-ev .t b{display:block;font-size:13.5px;font-weight:600;}
.st-ev .t>span{display:block;font-size:12px;color:var(--dim2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.st-ev .tm{font-size:11px;color:var(--dim2);flex-shrink:0;}


/* ===== v162: ранги и баллы ===== */
.rk-c-none{--mt:var(--dim2);}
.rk-c-bronze{--mt:#cd8a4f;}.rk-c-silver{--mt:#c3cbd6;}.rk-c-gold{--mt:#e8b84b;}.rk-c-platinum{--mt:#7fd6d0;}.rk-c-diamond{--mt:#9db8ff;}
body[data-t="light"] .rk-c-bronze{--mt:#b46d2e;}body[data-t="light"] .rk-c-silver{--mt:#7f8a99;}body[data-t="light"] .rk-c-gold{--mt:#c48b12;}
body[data-t="light"] .rk-c-platinum{--mt:#1d9a90;}body[data-t="light"] .rk-c-diamond{--mt:#4d72df;}
.rk-gray{--mt:var(--dim2)!important;}
.rkg{color:var(--mt);flex-shrink:0;display:block;}
.rkp{position:relative;display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;line-height:1.2;padding:2px 7px 2px 4px;border-radius:99px;margin-left:6px;vertical-align:2px;color:var(--mt);white-space:nowrap;}
.rkp::before{content:'';position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:.14;}
.rkp .rkg{display:inline-block;position:relative;}
.rk-hero{background:var(--surf);border-radius:20px;margin:0 18px 12px;padding:18px 16px 16px;}
.rk-top{display:flex;align-items:center;gap:14px;}
.rk-top b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;}
.rk-top span{display:block;font-size:13px;color:var(--dim);margin-top:2px;}
.rk-pts{display:flex;align-items:baseline;gap:8px;margin-top:16px;}
.rk-pts b{font-size:32px;font-weight:700;letter-spacing:-.02em;}
.rk-pts span{font-size:13px;color:var(--dim);}
.rk-bar{height:10px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden;}
.rk-bar i{display:block;height:100%;border-radius:99px;background:var(--mt);}
.rk-next{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.45;}
.rk-next b{color:var(--ink);font-weight:600;}
.rk-pause{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:12.5px;line-height:1.5;color:var(--dim);}
.rk-pause b{color:var(--ink);}
.rk-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;}
.rk-mini div{background:var(--card2);border-radius:12px;padding:9px 10px;min-width:0;}
.rk-mini b{display:block;font-size:17px;font-weight:700;white-space:nowrap;}
.rk-mini b small{font-size:12px;color:var(--dim);font-weight:500;}
.rk-mini span{display:block;font-size:11.5px;color:var(--dim2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-req{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
.st-ct+.rk-req{border-top:none;}
.rk-req .ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rk-req .ic.ok{background:var(--gs);}.rk-req .ic.no{background:rgba(226,88,90,.13);}
.rk-req .ic svg{width:15px;height:15px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.rk-req .ic.ok svg{stroke:var(--g);}.rk-req .ic.no svg{stroke:var(--red);}
.rk-req .t{flex:1;min-width:0;}.rk-req .t b{display:block;font-size:14px;font-weight:600;}.rk-req .t span{display:block;font-size:12px;color:var(--dim2);margin-top:2px;line-height:1.4;}
.rk-pt{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;}
.st-ct+.rk-pt{border-top:none;}
.rk-pt span{flex:1;min-width:0;}.rk-pt span small{display:block;font-size:11.5px;color:var(--dim2);margin-top:2px;line-height:1.4;}
.rk-pt b{font-family:'Roboto Mono',monospace;font-weight:700;font-size:15px;}
.rk-pt b.p,.rk-h .v.p{color:var(--g);}.rk-pt b.m,.rk-h .v.m{color:var(--red);}
.rk-note{font-size:12px;color:var(--dim);line-height:1.5;background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px;}
.rk-warn{font-size:12.5px;line-height:1.5;margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(226,88,90,.10);border:1px solid rgba(226,88,90,.35);color:var(--ink);}
.rk-warn b{color:var(--red);}
.rate-warn{font-size:11.5px;color:var(--dim2);margin-top:10px;line-height:1.4;text-align:center;}
.rk-h{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);}
.st-ct+.rk-h{border-top:none;}
.rk-h .t{flex:1;min-width:0;}.rk-h .t b{display:block;font-size:13.5px;font-weight:600;}.rk-h .t span{display:block;font-size:12px;color:var(--dim2);margin-top:2px;line-height:1.4;}
.rk-h .v{font-family:'Roboto Mono',monospace;font-weight:700;font-size:14px;color:var(--dim2);}
.rk-l{display:flex;gap:13px;padding:14px 0;border-top:1px solid var(--line);}
.st-ct+.rk-l{border-top:none;}
.rk-l .t{flex:1;min-width:0;}
.rk-l .t b{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;}
.rk-l .t b em{font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--gs);color:var(--g);}
.rk-l .t .need{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.45;}
.rk-l .t .give{font-size:12.5px;color:var(--ink);margin-top:6px;line-height:1.55;}
.rk-l .t .give i{font-style:normal;color:var(--g);margin-right:6px;}
.rk-l.cur{background:var(--card2);margin:0 -16px;padding:14px 16px;border-top:none;border-radius:14px;}
.rk-l.cur+.rk-l{border-top:none;}
/* доска почёта */
.lb-top{display:flex;gap:8px;align-items:flex-end;margin:10px 0 2px;}
.lb-top div{flex:1;min-width:0;background:var(--card2);border-radius:14px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;}
.lb-top div.first{padding-top:16px;background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.4);}
.lb-top div b{display:block;font-size:14px;font-weight:700;margin-top:6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-top div span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;}
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
.st-card.lb .lb-row:first-child{border-top:none;}
.lb-row .n{width:22px;text-align:center;font-family:'Roboto Mono',monospace;font-weight:700;color:var(--dim2);flex-shrink:0;}
.lb-row .t{flex:1;min-width:0;}.lb-row .t b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-row .t span{display:block;font-size:12px;color:var(--dim2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-row .v{font-family:'Roboto Mono',monospace;font-weight:700;font-size:14px;text-align:right;flex-shrink:0;}
.lb-row .v small{display:block;font-family:Golos Text,sans-serif;font-weight:500;font-size:11px;color:var(--dim2);}
.lb-row.me{background:var(--gs);margin:0 -16px;padding:11px 16px;border-radius:12px;border-top:none;}
.lb-row.me+.lb-row{border-top:none;}
.lb-gap{text-align:center;color:var(--dim2);letter-spacing:2px;padding:2px 0 6px;}
.lbsheet .st-card{margin:0 0 12px;background:var(--surf);}
.lbsheet .st-per{margin:0 0 10px;}
.lbsheet .empty{padding:24px 0;}
.lb-link{display:flex;align-items:center;gap:12px;width:calc(100% - 36px);margin:4px 18px 16px;padding:12px 14px;border-radius:16px;background:var(--surf);border:1px solid var(--line);color:var(--ink);font-family:Golos Text,sans-serif;text-align:left;cursor:pointer;}
.lb-link .t{flex:1;min-width:0;}.lb-link .t b{display:block;font-size:14.5px;font-weight:600;}.lb-link .t span{display:block;font-size:12px;color:var(--dim);margin-top:2px;}
.lb-link .chev{width:18px;height:18px;stroke:var(--dim2);fill:none;stroke-width:2;flex-shrink:0;}
/* отмена водителем: причины */
.opt2{display:flex;gap:12px;padding:12px;border:1px solid var(--line2);border-radius:14px;margin-bottom:8px;cursor:pointer;}
.opt2.on{border-color:var(--g);background:var(--gs);}
.opt2.dis{opacity:.45;cursor:default;}
.opt2 .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;margin-top:2px;box-sizing:border-box;}
.opt2.on .rd{border-color:var(--g);box-shadow:inset 0 0 0 3px var(--card2);background:var(--g);}
.opt2 b{display:block;font-size:14px;font-weight:600;}
.opt2 span{display:block;font-size:12px;color:var(--dim);margin-top:3px;line-height:1.45;}
.opt2 em{font-style:normal;font-weight:700;}.opt2 em.g{color:var(--g);}.opt2 em.r{color:var(--red);}

/* ===== v163: приглашения и панель «Ранги и баллы» ===== */
.rk-inv .st-say{margin:6px 0 10px;}
.inv-link{font-family:'Roboto Mono',monospace;font-size:13px;background:var(--card2);border-radius:12px;padding:11px 12px;word-break:break-all;user-select:all;-webkit-user-select:all;}
.inv-btns{display:flex;gap:8px;margin-top:10px;}
.inv-btns button{flex:1;border-radius:12px;padding:12px;font-family:Golos Text,sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;border:none;}

 if(/Failed to fetch|NetworkError|network/i.test(m))return 'Связь с сервером пропала. Проверьте интернет и повторите.';

function phoneNorm(v){
 let d=String(v==null?'':v).replace(/\D/g,'');
 if(!d)return '';
 if(d[0]==='8')d='7'+d.slice(1);
 else if(d[0]!=='7')d='7'+d;
 return d.slice(0,11);
}
function phoneValid(v){const d=phoneNorm(v);return d.length===11;}
function phoneFmt(v){
 const d=phoneNorm(v);
 if(!d)return '';
 const p=d.slice(1);
 let s='+7';
 if(p.length)s+=' ('+p.slice(0,3);
 if(p.length>3)s+=') '+p.slice(3,6);
 else if(p.length===3)s+=')';
 if(p.length>6)s+='-'+p.slice(6,8);
 if(p.length>8)s+='-'+p.slice(8,10);
 return s;
}
function maskPhone(el){

 const atEnd=el.selectionStart>=before.length;
 el.value=phoneFmt(before);
 if(atEnd||digitsBefore<=1){
  try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}
 }
}

async function restore(){
 const{data:all}=await db.from('rides').select('*').eq('passenger_id',me.id).in('status',['created','confirmed','in_progress']).order('created_at',{ascending:false}).limit(10);
 const soon=Date.now()+40*60*1000;   // становится активным за 40 минут до времени
 const list=(all||[]).filter(r=>!r.biz_id);   // доставки точки живут в режиме «Точка»
 planned=list.filter(r=>r.scheduled_at&&new Date(r.scheduled_at).getTime()>soon);
 if(planned.length)setTimeout(watchPlanned,600);
 const data=list.filter(r=>!planned.find(p=>p.id===r.id)).slice(0,1);
 if(data&&data.length){active=data[0];if(active.status==='created')subOffers(active.id);if(active.status==='confirmed'||active.status==='in_progress'){subRide(active.id);watchCompletion();watchUnread(active.id);}}
 // недавно завершённая поездка, которую пассажир ещё не оценил
 const dayAgo=new Date(Date.now()-24*3600*1000).toISOString();
 const{data:fin}=await db.from('rides').select('*').eq('passenger_id',me.id).eq('status','completed').gte('created_at',dayAgo).order('created_at',{ascending:false}).limit(1);
 if(fin&&fin.length&&fin[0].driver_id&&!fin[0].biz_id){      // доставки точки не просим оценивать при каждом входе
   const{data:rev}=await db.from('reviews').select('id').eq('ride_id',fin[0].id).eq('from_id',me.id).limit(1);
   if(!rev||!rev.length){pendingDone=fin[0];}
 }
}
async function restoreD(){
 const{data:allD}=await db.from('rides').select('*').eq('driver_id',me.id).in('status',['confirmed','in_progress']).order('created_at',{ascending:false}).limit(10);
 const soonD=Date.now()+40*60*1000;
 const listD=allD||[];
 dPlanned=listD.filter(r=>r.scheduled_at&&new Date(r.scheduled_at).getTime()>soonD);
 const data=listD.filter(r=>!dPlanned.find(p=>p.id===r.id)).slice(0,1);
 if(data&&data.length)dActive=data[0];
 const{data:o}=await db.from('offers').select('*').eq('driver_id',me.id).eq('status','pending');
 myOffs=o||[];
 const{data:sh}=await db.from('shifts').select('*').eq('driver_id',me.id).is('ended_at',null).order('started_at',{ascending:false}).limit(1);
 curShift=(sh&&sh.length)?sh[0]:null;
 // смена закончилась по расписанию — закроем и покажем итог при заходе
 if(curShift&&curShift.planned_end&&new Date(curShift.planned_end)<new Date()){
  const end=new Date();const mins=Math.max(1,Math.round((end-new Date(curShift.started_at))/60000));
  await api('/api/action',{action:'shift-close',shift_id:curShift.id,minutes:mins,auto_closed:true});
  await api('/api/me/update',{status:'offline'});
  me.status='offline';const st0=curShift.started_at;curShift=null;
  pendingShift={mins,from:st0,to:end};
 }
 if(curShift&&!curShift.planned_end){
  const dur=Date.now()-new Date(curShift.started_at).getTime();
  if(dur>10*60*60*1000){
   const end=new Date();const mins=Math.round(dur/60000);
   await api('/api/action',{action:'shift-close',shift_id:curShift.id,minutes:mins});
   await api('/api/me/update',{status:'offline'});
   me.status='offline';const st=curShift.started_at;curShift=null;
   pendingShift={mins,from:st,to:end};
  }
 }
 // смена, закрытая бэкендом за неактивность, которую водитель ещё не видел
 if(!curShift&&!pendingShift){
  const{data:done}=await db.from('shifts').select('*').eq('driver_id',me.id).not('ended_at','is',null).order('ended_at',{ascending:false}).limit(1);
  if(done&&done.length){
   const s=done[0];
   const seen=localStorage.getItem('bmb_shift_seen');
   if(seen!==s.id&&(Date.now()-new Date(s.ended_at).getTime())<3*60*60*1000){
    pendingShift={mins:s.minutes||0,from:s.started_at,to:new Date(s.ended_at),sid:s.id};
   }
  }
 }
}

async function finBiz(c,inb){

 const r=await api('/api/admin',{action:'biz-list'});
 if(r.error){c.innerHTML='<div class="empty">Не удалось загрузить</div>';return;}
 if(r.missing){c.innerHTML='<div class="cl-warn">Нужна миграция <b>db-30-biz.sql</b> в Supabase — до неё точки не работают.</div>';return;}
 bzaItems=r.items||[];
 const F=[['all','Все'],['pending','Ждут проверки'],['active','Работают'],['blocked','Приостановлены'],['rejected','Отклонены']];
 const cnt=k=>k==='all'?bzaItems.length:bzaItems.filter(b=>b.status===k).length;
 if(inb&&bzaF==='pending'&&!cnt('pending')){c.innerHTML=`<div class="empty"><b>Новых заявок нет</b>Все магазины и кафе — в «Ещё → Магазины и кафе».</div>`;return;}
 if(bzaF!=='all'&&!cnt(bzaF))bzaF='all';
 const list=bzaItems.filter(b=>bzaF==='all'||b.status===bzaF).sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));
 const mon=bzaItems.reduce((a,b)=>a+(b.month||0),0);
 let rule='';
 if(!inb){const g=await api('/api/admin',{action:'biz-rule-get'});if(g&&!g.error&&g.bizMin){const R=[['none','Всем'],['bronze','от 🥉 Бронзы'],['silver','от 🥈 Серебра'],['gold','от 🥇 Золота']];rule=`<div class="bz-sec">Кто может брать заказы магазинов</div><div class="bz-rule">${R.map(([k,l])=>`<div class="${g.bizMin===k?'on':''}" onclick="bizRuleSet('${k}')">${l}</div>`).join('')}</div>${g.ranks?'':'<div class="obhint" style="margin:-4px 18px 10px">Звания пока выключены — брать могут все.</div>'}`;}}
 c.innerHTML=`${rule}<div class="obhint" style="margin:0 18px 10px">${bzaItems.length} ${plural(bzaItems.length,['точка','точки','точек'])} · ждут проверки: ${cnt('pending')} · ${mon} ${plural(mon,['доставка','доставки','доставок'])} за месяц</div>
 <div class="st-cities">${F.filter(f=>f[0]==='all'||cnt(f[0])).map(f=>`<div class="${bzaF===f[0]?'on':''}" onclick="bzaF='${f[0]}';finBiz(bzBox())">${f[1]} <span class="pp-c">${cnt(f[0])}</span></div>`).join('')}</div>
 ${list.length?`<div class="st-card bz-card">${list.map(b=>`<div class="bz-row" onclick="bizCardA('${b.id}')"><div class="a"><b>${esc(b.name)}</b>${bzStPill(b.status)}</div><div class="w">${esc(BIZ_KIND[b.kind]||'точка')} · ${esc(b.city)}, ${esc(b.address)}<br>${b.status==='pending'?`подал ${esc(b.owner_name)} #${esc(b.owner_tag)} · ${pplAgo(b.created_at)} · ${esc(bizPh(b.phone))}`:`${b.month} ${plural(b.month,['доставка','доставки','доставок'])} за месяц${b.last?' · последняя '+pplAgo(b.last):''} · ${b.staff} ${plural(b.staff,['сотрудник','сотрудника','сотрудников'])}`}</div>${b.status==='pending'?`<div class="bt" onclick="event.stopPropagation()"><button class="g" onclick="bizSetA('${b.id}','active')">Одобрить</button>${b.phone?`<a href="tel:+${esc(b.phone)}"><button>Позвонить</button></a>`:''}<button class="r" onclick="bizSetA('${b.id}','rejected')">Отклонить</button></div>`:''}</div>`).join('')}</div>`:'<div class="empty"><b>Пока нет точек</b>Магазины и кафе подают заявку в приложении: Профиль → «Для магазинов и кафе».</div>'}

const THEMES=[
 {id:'green', name:'Зелёная',     sw:'#2fd06f'},
 {id:'orange',name:'Оранжевая',   sw:'#ff8a2b'},
 {id:'light', name:'Светлая',     sw:'linear-gradient(135deg,#ffffff 50%,#dfe3dd 50%)'},
 {id:'mono',  name:'Чёрно-белая', sw:'linear-gradient(135deg,#f2f2f4 50%,#17171a 50%)'},
 {id:'blue',  name:'Синяя',       sw:'#3d8bfd'}
];
function themeName(id){const t=THEMES.find(x=>x.id===id);return t?t.name:'Зелёная';}
function applyTheme(t){
 const ok=THEMES.some(x=>x.id===t)?t:'green';
 if(ok==='green')document.body.removeAttribute('data-t');
 else document.body.setAttribute('data-t',ok);
 try{localStorage.setItem('bmb_theme',ok);}catch(e){}
 try{
  const bg=getComputedStyle(document.body).getPropertyValue('--bg').trim();
  if(window.Telegram&&Telegram.WebApp){
   if(Telegram.WebApp.setBackgroundColor)Telegram.WebApp.setBackgroundColor(bg);
   if(Telegram.WebApp.setHeaderColor)Telegram.WebApp.setHeaderColor(bg);
  }
 }catch(e){}
}
try{const t0=localStorage.getItem('bmb_theme');if(t0)applyTheme(t0);}catch(e){}
async function setTheme(t){
 applyTheme(t);
 if(window.me)me.theme=t;
 themeSheet();
 // перерисуем экран под шторкой, чтобы подпись сменилась сразу
 try{
  if(role==='driver')drawD();
  else if(role==='admin')drawA();
  else drawP();
 }catch(e){}
 const r=await api('/api/me/update',{theme:t});
 if(r.error){T('Цвет применён только на этом телефоне');return;}
 if(r.me){me=r.me;}
 // если сервер ещё не умеет хранить цвет — держим выбор у себя
 if(!me.theme)me.theme=t;
}
function themeSheet(){
 const old=document.getElementById('sh');if(old)old.remove();
 // берём из профиля, иначе из памяти телефона — отметка не собьётся
 let cur=(window.me&&me.theme)||'';
 if(!cur){try{cur=localStorage.getItem('bmb_theme')||'';}catch(e){}}
 if(!THEMES.some(x=>x.id===cur))cur='green';
 const opts=THEMES.map(t=>'<button class="thopt '+(t.id===cur?'on':'')+'" onclick="setTheme(\''+t.id+'\')">'+
   '<span class="sw" style="background:'+t.sw+'"></span>'+t.name+'</button>').join('');
 const m=document.createElement('div');m.className='mask';m.id='sh';
 m.innerHTML='<div class="sheet"><h3>Цвет приложения</h3>'+
  '<div class="s">Выбор сохранится и на других устройствах</div>'+
  '<div class="themes">'+opts+'</div>'+
  '<div class="thhint">Светлая удобна днём, но ночью за рулём слепит — водителям лучше тёмная.</div>'+
  '<div class="sa"><button class="c" onclick="closeSh()">Готово</button></div></div>';
 document.getElementById('device').appendChild(m);
}

 ids.forEach(i=>{const e=document.getElementById(i);if(e)keep[i]=e.value;});
 h.innerHTML=formHTML(targetDrv);
 ids.forEach(i=>{
  const e=document.getElementById(i);const v=keep[i];

function priceVal(){const e=document.getElementById('oprice');const v=parseInt(e&&e.value,10);return v>0?v:null;}
function priceUi(){
 const v=priceVal();
 const box=document.querySelector('.pricebox');if(box)box.classList.toggle('set',!!v);
 const inp=document.getElementById('oprice');if(inp)inp.style.width=v?(String(v).length+0.7)+'ch':'';

 if(h&&!(_priceHint&&_priceHint.med&&_priceHint.city===me.city&&orderKind!=='delivery'&&!interCity))

function priceInput(e){
 const c=e.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,6);
 if(c!==e.value)e.value=c;

}
function setPrice(v){
 const e=document.getElementById('oprice');if(!e)return;
 e.value=(v&&v>0)?String(Math.min(v,100000)):'';
